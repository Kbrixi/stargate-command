<script>
/* ===== FOLDERS (dossiers dynamiques) ===== */
const PALETTE=['#ff9c00','#9999ff','#5fbf8f','#ffcc66','#cc99cc','#cc6666','#ff9966','#99ccff'];
const DEFAULT_FOLDERS=[
{key:'jobsearch',name:'Job Search',icon:'fa-briefcase',color:'#ff9c00'},
{key:'hospinov',name:'Hospinov',icon:'fa-heart',color:'#9999ff'},
{key:'aentik',name:'Aentik',icon:'fa-cube',color:'#5fbf8f'},
{key:'others',name:'Others',icon:'fa-ellipsis',color:'#cc99cc'}
];
function ldFolders(){try{const s=localStorage.getItem('cdc_folders');if(s)return JSON.parse(s);}catch(e){}return JSON.parse(JSON.stringify(DEFAULT_FOLDERS));}
let FOLDERS=ldFolders();
function svFolders(){localStorage.setItem('cdc_folders',JSON.stringify(FOLDERS));}
function fldr(key){return FOLDERS.find(f=>f.key===key);}
function newFolderKey(name){let k=name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'').slice(0,20)||('f'+Date.now());let base=k,i=1;while(FOLDERS.some(f=>f.key===k)){k=base+i;i++;}return k;}

/* ===== DONNÉES ===== */
function emptyFolderData(){return{projects:[],tasks:[],contacts:[],files:[]};}
function ldData(){try{const s=localStorage.getItem('cdc_data');if(s)return JSON.parse(s);}catch(e){}const d={};FOLDERS.forEach(f=>d[f.key]=emptyFolderData());return d;}
let D=ldData();
FOLDERS.forEach(f=>{if(!D[f.key])D[f.key]=emptyFolderData();});
function svData(){localStorage.setItem('cdc_data',JSON.stringify(D));}

function ldLog(){try{const s=localStorage.getItem('cdc_log');if(s)return JSON.parse(s);}catch(e){}return[];}
let CL=ldLog();
function svLog(){localStorage.setItem('cdc_log',JSON.stringify(CL));}

/* ===== MARKETING (module type HubSpot) ===== */
function emptyMk(){return{campaigns:[],content:[],emails:[],social:[],pages:[],ads:[]};}
function ldMk(){try{const s=localStorage.getItem('cdc_marketing');if(s)return{...emptyMk(),...JSON.parse(s)};}catch(e){}return emptyMk();}
let MK=ldMk();
function svMk(){localStorage.setItem('cdc_marketing',JSON.stringify(MK));}

function ldSettings(){try{const s=localStorage.getItem('cdc_settings');if(s)return{followUpDays:7,...JSON.parse(s)};}catch(e){}return{logo:'Cockpit de Chasse',followUpDays:7};}
let SET=ldSettings();
function svSettings(){localStorage.setItem('cdc_settings',JSON.stringify(SET));}

/* ===== PROSPECTION : PIPELINE, TAGS, MODÈLES ===== */
const PROSPECT_STAGES=[
{key:'a_contacter',label:'À contacter',color:'#c9a97e',bg:'rgba(201,169,126,.15)'},
{key:'contacte',label:'Contacté',color:'#9999ff',bg:'rgba(153,153,255,.15)'},
{key:'relance1',label:'Relance 1',color:'#ffcc66',bg:'rgba(255,204,102,.15)'},
{key:'relance2',label:'Relance 2',color:'#ffcc66',bg:'rgba(255,204,102,.15)'},
{key:'reponse',label:'A répondu',color:'#5fbf8f',bg:'rgba(95,191,143,.15)'},
{key:'rdv',label:'RDV pris',color:'#cc99cc',bg:'rgba(204,153,204,.15)'},
{key:'perdu',label:'Perdu',color:'#c9a97e',bg:'rgba(201,169,126,.15)'}
];
function prospectStage(c){return PROSPECT_STAGES.find(s=>s.key===(c&&c.prospectStatus))||PROSPECT_STAGES[0];}
function daysSince(dateStr){if(!dateStr)return null;const then=new Date(dateStr+'T00:00:00');if(isNaN(then.getTime()))return null;return Math.floor((new Date(todayStr()+'T00:00:00')-then)/86400000);}
function needsFollowUp(c){const stage=(c.prospectStatus||'a_contacter');if(!['contacte','relance1','relance2'].includes(stage))return false;const d=daysSince(c.lastContactedAt);return d!=null&&d>=(SET.followUpDays||7);}

function ldTemplates(){try{const s=localStorage.getItem('cdc_templates');if(s)return JSON.parse(s);}catch(e){}return[
{id:1,name:'Premier contact',body:"Bonjour {{prenom}},\n\nJe me permets de vous contacter suite à votre profil chez {{entreprise}}. Votre poste de {{poste}} m'intéresse particulièrement dans le cadre de mes démarches actuelles.\n\nSeriez-vous disponible pour un échange rapide ?\n\nBien à vous"},
{id:2,name:'Relance',body:"Bonjour {{prenom}},\n\nJe me permets de revenir vers vous suite à mon précédent message, resté sans réponse — je comprends que votre emploi du temps soit chargé.\n\nSeriez-vous disponible pour un bref échange dans les prochains jours ?\n\nBien à vous"}
];}
let TEMPLATES=ldTemplates();
function svTemplates(){localStorage.setItem('cdc_templates',JSON.stringify(TEMPLATES));}
function personalizeTemplate(body,c){
const prenom=c.firstName||((c.name||'').trim().split(/\s+/)[0]||'');
const nomF=c.lastName||c.name||'';
return(body||'').replace(/\{\{\s*prenom\s*\}\}/gi,prenom).replace(/\{\{\s*nom\s*\}\}/gi,nomF).replace(/\{\{\s*entreprise\s*\}\}/gi,c.company||'').replace(/\{\{\s*poste\s*\}\}/gi,c.title||'');
}
function copyToClipboard(text){
return new Promise(resolve=>{
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(text).then(()=>resolve(true)).catch(()=>resolve(fallbackCopy(text)));
}else{resolve(fallbackCopy(text));}
});
}
function fallbackCopy(text){
try{
const ta=document.createElement('textarea');
ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
document.body.appendChild(ta);ta.focus();ta.select();
const ok=document.execCommand('copy');
document.body.removeChild(ta);
return ok;
}catch(e){return false;}
}
function contactDisplayName(c){return(c.firstName&&c.lastName)?c.firstName+' '+c.lastName:(c.firstName||c.lastName||c.name||'?');}
function normLI(url){if(!url)return'';return String(url).toLowerCase().trim().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/$/,'').split('?')[0];}
function findDupeContact(folder,candidate){
const list=(D[folder]&&D[folder].contacts)||[];
return list.find(c=>{
if(candidate.linkedin&&c.linkedin&&normLI(candidate.linkedin)===normLI(c.linkedin))return true;
if(candidate.email&&c.email&&candidate.email.toLowerCase().trim()===c.email.toLowerCase().trim())return true;
const cFull=contactDisplayName(c).toLowerCase().trim();
const xFull=(candidate.firstName&&candidate.lastName)?candidate.firstName+' '+candidate.lastName:(candidate.name||'').toLowerCase().trim();
if(cFull&&xFull&&cFull===xFull&&(candidate.company||'').toLowerCase().trim()===(c.company||'').toLowerCase().trim())return true;
return false;
});
}

/* ===== FIREBASE CLOUD SYNC ===== */
const FB={app:null,auth:null,db:null,uid:null,userEmail:null,listener:null,connected:false,pushing:false,signingIn:false};
const FB_KEYS=['cdc_folders','cdc_data','cdc_log','cdc_marketing','cdc_settings','cdc_templates','cdc_gcal_client_id','cdc_notes_data'];
/* Config Firebase par défaut de l'app (projet stargate-command-fd9fa).
   Ces valeurs client Firebase sont publiques par design : la sécurité repose
   sur les règles Firestore, pas sur le secret de l'apiKey. Cela permet à
   n'importe quel appareil (desktop, mobile, PWA) de se connecter au même
   projet sans ressaisir la config manuellement. */
const DEFAULT_FB_CONFIG={apiKey:'AIzaSyDHJZtyT0e3L4_jnpWPbzPvsioMw58uSY0',authDomain:'stargate-command-fd9fa.firebaseapp.com',projectId:'stargate-command-fd9fa',appId:''};
function fbLoadConfig(){try{var c=JSON.parse(localStorage.getItem('cdc_fb_config'));if(c&&c.apiKey&&c.projectId)return c;}catch(e){}return DEFAULT_FB_CONFIG;}
function fbSaveConfig(cfg){localStorage.setItem('cdc_fb_config',JSON.stringify(cfg));}
function fbIsReady(){return FB.app&&FB.db&&FB.uid;}

function fbInit(cfg){
try{
if(FB.app){try{FB.app.delete();}catch(e){}}
FB.app=firebase.initializeApp({apiKey:cfg.apiKey,authDomain:cfg.authDomain,projectId:cfg.projectId,storageBucket:cfg.storageBucket||'',messagingSenderId:cfg.messagingSenderId||'',appId:cfg.appId||''});
FB.auth=firebase.auth();
FB.db=firebase.firestore();
/* Safari (streaming HTTP cassé) et Opera (VPN/proxy intégré) bloquent silencieusement
   le canal temps réel par défaut de Firestore (WebChannel). On force le long-polling,
   qui repose sur des requêtes HTTP classiques et fonctionne partout. Doit être appelé
   avant tout autre appel Firestore. */
try{FB.db.settings({experimentalAutoDetectLongPolling:true,merge:true});}catch(e){}
FB.db.enablePersistence({synchronizeTabs:true}).catch(function(){/* offline ok */});
FB.auth.onAuthStateChanged(function(user){
/* DEBUG supprimé : alert('DEBUG onAuthStateChanged: user='+(user?user.uid:'null')); */
if(user&&FB.uid!==user.uid){fbOnSignedIn(user);}
});
setTimeout(function(){fbHandleRedirectResult();},500);
}catch(e){toast('Firebase init erreur: '+e.message,'err');}
}

/* Flag pour empêcher onSnapshot d'écraser les données locales pendant un import */
var _fbImporting=false;

/* Firestore limite un document à 1 MiB (1 048 576 octets). Quand les données
   dépassent cette limite, on les répartit sur plusieurs documents Firestore :
   - Document principal  crm_data/{uid}       : {_ts, _parts, json: chunk0}
   - Documents annexes   crm_data/{uid}_p{i}  : {json: chunk_i}
   La lecture recombine tous les chunks.                                       */

var FB_CHUNK=800000; /* chars par chunk — laisse de la marge sous 1 MiB */

function fbReadRemote(snap){
/* Lit un snapshot du document principal et retourne (Promise) l'objet payload
   ou null. Gère les 4 formats : LZ compressé, multi-doc, simple, ancien.   */
if(!snap.exists)return Promise.resolve(null);
var d=snap.data();
/* Format v4 LZ compressé : {lz: "...(LZString Base64)...", _ts: number} */
if(d.lz){try{return Promise.resolve(JSON.parse(LZString.decompressFromBase64(d.lz)));}catch(e){console.error('[Firebase] LZString decompress erreur:',e);return Promise.resolve(null);}}
/* Format multi-doc : le doc principal a _parts > 1 */
if(d._parts&&d._parts>1){
var base=d.json||'';
var promises=[];
for(var i=1;i<d._parts;i++){
promises.push(FB.db.collection('crm_data').doc(FB.uid+'_p'+i).get());
}
return Promise.all(promises).then(function(snaps){
var parts=[base];
for(var j=0;j<snaps.length;j++){
if(snaps[j].exists&&snaps[j].data().json)parts.push(snaps[j].data().json);
}
try{return JSON.parse(parts.join(''));}catch(e){console.error('[Firebase] Multi-doc parse error:',e);return null;}
});
}
/* Format simple : un seul doc avec json */
if(d.json&&typeof d.json==='string'&&d.json.length>2){
try{return Promise.resolve(JSON.parse(d.json));}catch(e){console.error('[Firebase] JSON parse error:',e);return Promise.resolve(null);}
}
/* Ancien format : {data:{...}} */
if(d.data)return Promise.resolve(d.data);
return Promise.resolve(null);
}

function fbStartSync(){
if(!fbIsReady())return;
var docRef=FB.db.collection('crm_data').doc(FB.uid);
if(FB.listener)FB.listener();
var _firstSnap=true;
/* Sauvegarder le timestamp local au démarrage pour détecter si nos
   données locales sont déjà à jour par rapport au cloud */
var _initLocalTs=parseInt(localStorage.getItem('cdc_fb_ts')||'0');
FB.listener=docRef.onSnapshot(function(snap){
/* Si on est en train d'importer, ne PAS écraser les données locales */
if(_fbImporting){_firstSnap=false;FB.connected=true;fbShowStatus();return;}
fbReadRemote(snap).then(function(remote){
if(remote){
var ts=remote._ts||0;var localTs=parseInt(localStorage.getItem('cdc_fb_ts')||'0');
/* N'appliquer les données distantes que si le timestamp est différent
   ET plus récent que ce qu'on a localement. Cela empêche un snapshot
   retardé d'écraser des données plus récentes. */
if(ts!==localTs&&ts>localTs){fbApplyRemote(remote);localStorage.setItem('cdc_fb_ts',String(ts));}
}else if(_firstSnap){
fbPush(true);
if(!(typeof NS!=='undefined'&&NS.isEditorOpen&&NS.selectedNoteId))toast('Cloud initialisé avec les données de cet appareil','info');
}
_firstSnap=false;
FB.connected=true;fbShowStatus();
});
},function(err){FB.connected=false;fbShowStatus();});
}

function fbApplyRemote(remote){
/* Si on est en train d'importer, ne PAS écraser les données locales */
if(_fbImporting)return;
FB_KEYS.forEach(function(k){
if(remote[k]!==undefined&&remote[k]!==null){
try{
var parsed=(typeof remote[k]==='string')?JSON.parse(remote[k]):remote[k];
localStorage.setItem(k,JSON.stringify(parsed));
}catch(e){}
}
});
/* Recharger les variables en mémoire */
FOLDERS=ldFolders();D=ldData();CL=ldLog();MK=ldMk();SET=ldSettings();TEMPLATES=ldTemplates();GCAL.clientId=localStorage.getItem('cdc_gcal_client_id')||'';
/* Recharger aussi les notes si le module existe */
if(typeof ND!=='undefined'){var newND=ldNotes();if(newND){ND.notes=newND.notes;ND.categories=newND.categories;ND.tags=newND.tags;}}
FOLDERS.forEach(function(f){if(!D[f.key])D[f.key]=emptyFolderData();});
/* Si l'utilisateur est en train d'éditer une note, ne PAS re-render l'éditeur */
if(typeof NS!=='undefined'&&NS.isEditorOpen&&NS.selectedNoteId){
  updateNavActive();
  NS._pendingSyncRender=true;
}else{
  ren();
  toast('Données synchronisées depuis le cloud','info');
}
}

var _fbPushQueued=false;
var _fbPushTimer=null;
function fbQueuePush(){
if(_fbPushQueued)return;
_fbPushQueued=true;
_fbPushTimer=setTimeout(function(){_fbPushQueued=false;_fbPushTimer=null;fbPush();},1500);
}
function fbCancelQueuedPush(){
if(_fbPushTimer){clearTimeout(_fbPushTimer);_fbPushTimer=null;}
_fbPushQueued=false;
}

function fbDoPush(){
FB.pushing=true;
var payload={};
FB_KEYS.forEach(function(k){var v=localStorage.getItem(k);if(v&&v!=='undefined'&&v!=='[object Object]')payload[k]=v;});
payload._ts=Date.now();
var jsonStr=JSON.stringify(payload);

/* Compression LZString Base64 : réduit la taille du JSON
   (typiquement 50-60%) pour rester sous la limite Firestore
   de 1 MiB par document. */
var compressed=LZString.compressToBase64(jsonStr);
console.log('[Firebase] Push: json original='+jsonStr.length+' bytes, compressé='+compressed.length+' bytes, ratio='+Math.round(compressed.length/jsonStr.length*100)+'%, _ts:'+payload._ts);

/* Si le payload compressé tient dans un seul document, on l'écrit directement */
if(compressed.length<=FB_CHUNK){
return FB.db.collection('crm_data').doc(FB.uid).set({lz:compressed,_ts:payload._ts}).then(function(){
localStorage.setItem('cdc_fb_ts',String(payload._ts));
FB.connected=true;fbShowStatus();
console.log('[Firebase] Push OK (compressé), ts='+payload._ts);
return true;
}).catch(function(e){
FB.connected=false;fbShowStatus();
var msg=(e.code||'')+': '+(e.message||e);
console.error('[Firebase] Push ERREUR:',msg);
var now=Date.now();if(!FB._lastErrToast||now-FB._lastErrToast>30000){toast('Sync erreur: '+msg,'err');FB._lastErrToast=now;}
return false;
}).finally(function(){FB.pushing=false;});
}

/* Fallback : données trop volumineuses même après compression LZ.
   Le chunking multi-doc ({uid}_p1, {uid}_p2…) est impossible car
   les règles Firestore n'autorisent que le document {uid} exact.
   On tente un write sans compression en dernier recours (échouera
   silencieusement si > 1 MiB), puis on alerte l'utilisateur. */
console.warn('[Firebase] Données compressées ('+compressed.length+' chars) dépassent FB_CHUNK. Tentative write direct...');
return FB.db.collection('crm_data').doc(FB.uid).set({json:jsonStr,_ts:payload._ts}).then(function(){
localStorage.setItem('cdc_fb_ts',String(payload._ts));
FB.connected=true;fbShowStatus();
console.log('[Firebase] Push OK (json direct, '+jsonStr.length+' chars), ts='+payload._ts);
return true;
}).catch(function(e){
FB.connected=false;fbShowStatus();
var msg=(e.code||'')+': '+(e.message||e);
console.error('[Firebase] Push ERREUR:',msg);
var now=Date.now();if(!FB._lastErrToast||now-FB._lastErrToast>30000){toast('Sync erreur: '+msg,'err');FB._lastErrToast=now;}
return false;
}).finally(function(){FB.pushing=false;});
}

/* Vérifie directement sur le serveur (et non via le listener local, qui peut
   être en retard) si une version distante plus récente que ce que cet
   appareil a reçue existe déjà. Retourne les données distantes s'il y a un
   conflit potentiel, sinon null. */
function fbCheckRemoteConflict(){
return FB.db.collection('crm_data').doc(FB.uid).get({source:'server'}).then(function(snap){
return fbReadRemote(snap);
}).then(function(remote){
if(remote){
var ts=remote._ts||0;var localTs=parseInt(localStorage.getItem('cdc_fb_ts')||'0');
if(ts&&ts!==localTs&&ts>localTs)return remote;
}
return null;
}).catch(function(){return null;});
}

function fbPush(force){
if(!fbIsReady()||FB.pushing)return Promise.resolve(false);
if(force)return fbDoPush();
return fbCheckRemoteConflict().then(function(remote){
if(!remote)return fbDoPush();
/* Une version distante que cet appareil n'a jamais reçue existe déjà :
   l'écraser sans prévenir romprait silencieusement le modèle "tout remplace
   tout". On demande confirmation, avec la récupération du distant comme
   choix par défaut le plus sûr. */
var when=new Date(remote._ts||0).toLocaleString('fr-FR');
var ecraser=confirm('Des données cloud plus récentes existent (mises à jour le '+when+') et n\'ont pas encore été reçues par cet appareil.\n\nOK = écraser le cloud avec les données de CET appareil\nAnnuler = récupérer d\'abord les données du cloud (recommandé)');
if(ecraser)return fbDoPush();
fbApplyRemote(remote);
localStorage.setItem('cdc_fb_ts',String(remote._ts||0));
toast('Données distantes récupérées, rien envoyé depuis cet appareil','info');
return false;
});
}

function fbShowStatus(){
var el=document.getElementById('fbStatusBadge');
if(el){
if(FB.connected){el.innerHTML='<i class="fa-solid fa-cloud-check mr-1"></i>Connecté'+(FB.userEmail?' ('+FB.userEmail+')':'');el.className='text-ok text-[.65rem]';}
else{el.innerHTML='<i class="fa-solid fa-cloud-xmark mr-1"></i>Déconnecté';el.className='text-mut text-[.65rem]';}
}
var diagEl=document.getElementById('fbDiagBox');
if(diagEl)diagEl.innerHTML=fbDiagLine();
}

/* Ligne de diagnostic affichée en permanence dans Paramètres, pour pouvoir
   comparer visuellement desktop et mobile sans passer par la console
   (utile sur mobile où la console n'est pas accessible facilement). */
function fbDiagLine(){
if(!FB.app)return 'Firebase non initialisé.';
var localTs=parseInt(localStorage.getItem('cdc_fb_ts')||'0');
var lignes=[];
lignes.push('UID : '+(FB.uid?FB.uid:'—'));
lignes.push('Email : '+(FB.userEmail||'—'));
lignes.push('Dernier horodatage connu sur cet appareil : '+(localTs?new Date(localTs).toLocaleString('fr-FR'):'aucun'));
return lignes.join('<br>');
}

/* Vérifie l'état réel du cloud (lecture forcée sur le serveur, pas le cache)
   et affiche un rapport complet via alert() — fonctionne sur mobile sans
   avoir besoin d'ouvrir la console développeur. À lancer sur desktop ET
   mobile puis comparer les deux rapports. */
function fbDiagCheck(){
if(!fbIsReady()){alert('DIAGNOSTIC\n\nPas prêt : non connecté à Firebase sur cet appareil.');return;}
var localTs=parseInt(localStorage.getItem('cdc_fb_ts')||'0');
FB.db.collection('crm_data').doc(FB.uid).get({source:'server'}).then(function(snap){
var lignes=['--- DIAGNOSTIC CLOUD ---',''];
lignes.push('UID : '+FB.uid);
lignes.push('Email : '+(FB.userEmail||'—'));
lignes.push('Document principal existe : '+(snap.exists?'OUI':'NON'));
var d=snap.exists?snap.data():{};
/* Indiquer le format de stockage */
if(d.lz)lignes.push('Format : LZ compressé (v4)');
else if(d._parts&&d._parts>1)lignes.push('Format : multi-doc ('+d._parts+' parties)');
else if(d.json&&typeof d.json==='string'&&d.json.length>2)lignes.push('Format : json simple');
else if(d.data)lignes.push('Format : ancien (data imbriquée)');
return fbReadRemote(snap).then(function(remote){
var rts=remote?(remote._ts||0):0;
if(remote){
lignes.push('Horodatage distant : '+(rts?new Date(rts).toLocaleString('fr-FR'):'aucun')+' (brut '+rts+')');
lignes.push('Nombre de clés stockées côté cloud : '+Object.keys(remote).filter(function(k){return k!=='_ts';}).length);
}
lignes.push('');
lignes.push('Horodatage local connu : '+(localTs?new Date(localTs).toLocaleString('fr-FR'):'aucun')+' (brut '+localTs+')');
lignes.push('');
lignes.push(remote&&rts===localTs?'SYNCHRONISÉ avec le cloud':'DÉCALAGE : cet appareil n\'a pas la dernière version du cloud (ou inversement)');
alert(lignes.join('\n'));
});
}).catch(function(e){
alert('ERREUR lors de la vérification cloud :\n\n'+(e.code||'')+'\n'+(e.message||e));
});
}

function fbDisconnect(){
if(FB.listener){FB.listener();FB.listener=null;}
if(FB.auth){FB.auth.signOut();}
FB.connected=false;FB.app=null;FB.auth=null;FB.db=null;FB.uid=null;FB.userEmail=null;
localStorage.removeItem('cdc_fb_config');
localStorage.removeItem('cdc_fb_uid');
localStorage.removeItem('cdc_fb_ts');
fbShowStatus();
toast('Cloud sync déconnecté','info');
}

/* Intercepter les sauvegardes pour push Firebase */
var _origSvData=svData,_origSvFolders=svFolders,_origSvLog=svLog,_origSvMk=svMk,_origSvSettings=svSettings,_origSvTemplates=svTemplates;
svData=function(){_origSvData();if(fbIsReady())fbQueuePush();};
svFolders=function(){_origSvFolders();if(fbIsReady())fbQueuePush();};
svLog=function(){_origSvLog();if(fbIsReady())fbQueuePush();};
svMk=function(){_origSvMk();if(fbIsReady())fbQueuePush();};
svSettings=function(){_origSvSettings();if(fbIsReady())fbQueuePush();};
svTemplates=function(){_origSvTemplates();if(fbIsReady())fbQueuePush();};
function fbOnSignedIn(user){
/* DEBUG supprimé */

function fbGoogleSignIn(){
/* DEBUG supprimé */
if(!FB.auth){toast('Configure Firebase d\'abord','err');return;}
var provider=new firebase.auth.GoogleAuthProvider();
provider.addScope('email');
/* signInWithPopup : recommandation officielle Firebase pour les apps qui ne
   sont pas hébergées sur Firebase Hosting (firebase.google.com/docs/auth/web/redirect-best-practices).
   Comme authDomain (stargate-command-fd9fa.firebaseapp.com) est un domaine
   différent de celui qui héberge l'app (kbrixi.github.io), signInWithRedirect
   nécessite un accès de stockage "cross-domain" que Chrome/Brave/Safari
   bloquent désormais par défaut, sans erreur visible (c'est le blocage qu'on
   vient d'identifier). signInWithPopup relaie le résultat par postMessage
   entre la popup et la fenêtre d'origine, ce qui évite ce blocage précis.
   onAuthStateChanged (indépendant de cette promesse) sert de filet de
   sécurité si jamais la promesse ci-dessous ne se résout pas malgré tout. */
FB.signingIn=true;
/* DEBUG supprimé */
FB.auth.signInWithPopup(provider).then(function(result){
/* DEBUG supprimé */
if(result&&result.user)fbOnSignedIn(result.user);
}).catch(function(e){
FB.signingIn=false;
/* DEBUG supprimé */
if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')return;
console.error('[Firebase] signInWithPopup erreur:',e.code,e.message);
toast('Erreur connexion Google: '+e.code+' — '+e.message,'err');
});
}

function fbGoogleSignOut(){
if(FB.auth){
FB.auth.signOut().then(function(){
if(FB.listener){FB.listener();FB.listener=null;}
FB.connected=false;FB.uid=null;FB.userEmail=null;
localStorage.removeItem('cdc_fb_ts');
fbShowStatus();toast('Déconnecté du cloud','info');
openSettingsM();
});}
}

function fbHandleRedirectResult(){
if(!FB.auth)return;
var wasPending=sessionStorage.getItem('cdc_fb_redirect_pending')==='1';
FB.auth.getRedirectResult().then(function(result){
if(result&&result.user){
sessionStorage.removeItem('cdc_fb_redirect_pending');
fbOnSignedIn(result.user);
}else if(wasPending){
/* On attendait un retour de connexion (le drapeau a été posé juste avant le
   départ vers Google) mais aucun utilisateur n'est revenu, sans erreur non
   plus. Cela signifie que Firebase n'a pas retrouvé l'opération de connexion
   en attente au retour (state perdu entre le départ et le retour). */
sessionStorage.removeItem('cdc_fb_redirect_pending');
console.error('[Firebase] getRedirectResult() sans utilisateur ni erreur alors qu\'une redirection était en attente.');
toast('Connexion Google incomplète : le retour de redirection n\'a pas été reconnu (state perdu). Voir console.','err');
}
}).catch(function(e){
sessionStorage.removeItem('cdc_fb_redirect_pending');
if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/redirect-cancelled-by-user'){
console.error('[Firebase] getRedirectResult() erreur:',e.code,e.message);
toast('Erreur connexion: '+e.code+' — '+e.message,'err');
}
});
}

function _getAudioCtx(){
try{let c=window.__lcarsCtx;if(!c||c.state==='closed'){c=new(window.AudioContext||window.webkitAudioContext)();window.__lcarsCtx=c;}
if(c.state==='suspended')c.resume();return c;}catch(e){return null;}
}function lcarsBeep(freqs,dur,type,peak){
dur=dur||0.09;type=type||'sine';peak=peak??0.14;
try{
const ctx=_getAudioCtx();if(!ctx)return;
let t=ctx.currentTime;
freqs.forEach(f=>{
const osc=ctx.createOscillator();const g=ctx.createGain();
osc.type=type;osc.frequency.setValueAtTime(f,t);
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
osc.connect(g).connect(ctx.destination);osc.start(t);osc.stop(t+dur+0.03);
t+=dur*0.75;
});
}catch(e){}
}

/* ===== NORMALISATION & FLOU (fuzzy matching) ===== */
function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[''`]/g,"'").replace(/\s+/g,' ').trim();}
function levenshtein(a,b){a=a||'';b=b||'';const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const dp=new Array(n+1);for(let j=0;j<=n;j++)dp[j]=j;for(let i=1;i<=m;i++){let prev=dp[0];dp[0]=i;for(let j=1;j<=n;j++){const tmp=dp[j];dp[j]=Math.min(dp[j]+1,dp[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=tmp;}}return dp[n];}
function simRatio(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;const d=levenshtein(a,b);return 1-d/Math.max(a.length,b.length);}
/* Cherche le meilleur candidat correspondant a une requete texte, en essayant : correspondance exacte,
   inclusion de sous-chaine (dans les deux sens), inclusion mot-a-mot, puis distance floue en dernier recours. */
function fuzzyFind(list,query,keyFn){
if(!query)return list[0]||null;
const q=norm(query);if(!q)return list[0]||null;
let best=null,bestScore=-1;
for(const item of list){
const label=norm(keyFn(item));
if(!label)continue;
let score=0;
if(label===q)score=100;
else if(label.includes(q)||q.includes(label))score=80-Math.abs(label.length-q.length)*0.2;
else{
const qWords=q.split(' ').filter(Boolean);
const hitWords=qWords.filter(w=>w.length>1&&label.includes(w)).length;
if(hitWords&&qWords.length)score=40*(hitWords/qWords.length);
const r=simRatio(label,q);
if(r>0.6)score=Math.max(score,r*70);
}
if(score>bestScore){bestScore=score;best=item;}
}
return bestScore>=25?best:null;
}
/* Extrait le nom recherche en retirant TOUS les mots-outils (pas seulement la 1ere occurrence),
   pour eviter qu'un mot comme "contact" ou "de" reste colle au nom et fausse le fuzzyFind. */
function extractNameQuery(t){
return t
.replace(/[-']/g,' ')
.replace(/\b(?:montre|affiche|cherche|trouve|ouvre|ouvrir|voir|vois|va|amene|amenemoi|moi|detail|peux|tu|stp|svp|modifie|modifier|edite|editer|corrige|corriger|actualise|actualiser|change|changer|mets|mettre|jour)\b/g,' ')
.replace(/\b(?:contact|fiche|prospect|client|personne|entreprise|societe|boite|employeur)\b/g,' ')
.replace(/\b(?:de|du|des|le|la|les|un|une|ce|cet|cette|son|sa|ses)\b/g,' ')
.replace(/\s+/g,' ').trim();
}

/* ===== DATES INTELLIGENTES ===== */
const WEEKDAYS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MONTHS=['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function resolveSmartDate(expr){
if(!expr)return null;
const d=norm(expr).trim();
const today=new Date();today.setHours(0,0,0,0);
if(/^(?:aujourd ?hui|ce jour)$/.test(d))return localDateStr(today);
if(/^demain$/.test(d))return localDateStr(addDays(today,1));
if(/^(?:apres[- ]demain)$/.test(d))return localDateStr(addDays(today,2));
if(/^hier$/.test(d))return localDateStr(addDays(today,-1));
let m=d.match(/^dans\s+(\d+)\s*jour/);
if(m)return localDateStr(addDays(today,parseInt(m[1],10)));
m=d.match(/^(\d+)\s*jour/);
if(m)return localDateStr(addDays(today,parseInt(m[1],10)));
if(/semaine\s*prochaine/.test(d)){const target=addDays(today,7);return localDateStr(target);}
if(/(?:ce|cette)\s*semaine/.test(d)){const target=addDays(today,(7-today.getDay())%7||7);return localDateStr(target);}
for(let i=0;i<WEEKDAYS.length;i++){
if(d.includes(WEEKDAYS[i])){
let delta=(i-today.getDay()+7)%7;
if(delta===0)delta=7;
if(/prochain/.test(d))delta+=delta<=7?0:0;
return localDateStr(addDays(today,delta));
}
}
m=d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
if(m){let y=m[3];if(y.length===2)y='20'+y;return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;}
m=d.match(/^(\d{1,2})\/(\d{1,2})$/);
if(m){return `${today.getFullYear()}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;}
m=d.match(/^(\d{1,2})(?:er)?\s+([a-z]+)(?:\s+(\d{4}))?$/);
if(m){const mi=MONTHS.findIndex(mo=>mo.startsWith(m[2])); if(mi>=0){const y=m[3]||today.getFullYear();return `${y}-${String(mi+1).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;}}
if(/^\d{4}-\d{2}-\d{2}$/.test(d))return d;
return null;
}
function extractDateFromQuery(t){
const m=t.match(/(?:pour|le|de|du|au|a|jusqu ?au|avant|entre(?:\s*le|\s*les?)?)\s+(.+)/);
if(!m)return null;
const rest=m[1].trim();
for(let i=rest.length;i>1;i--){const cand=rest.slice(0,i);const r=resolveSmartDate(cand);if(r)return r;}
return resolveSmartDate(rest);
}

['chez','a','@','poste','fonction','titre','role','email','courriel','mail','tel','telephone','tag','etiquette','statut','status','dossier','categorie','entreprise','societe'].forEach(k=>{

/* ===== SEARCH ===== */
function doSearch(raw,query){
const ql=norm(query);
const ch=allContactsFlatE().filter(c=>norm(contactLabel(c)+' '+(c.email||'')+' '+(c.title||'')+' '+(c.tags||[]).join(' ')).includes(ql));

if(!total){
/* repli flou si aucune correspondance exacte */
const fc=fuzzyFind(allContactsFlatE(),query,c=>contactLabel(c));
const ft=fuzzyFind(allTasksFlatE(),query,t=>t.name);

if(fp)html+='&bull; Projet <b>'+escHtml(fp.name)+'</b> ('+escHtml(fp.folder)+')<br>';
botSay(html);return;
}
botSay('Aucun resultat pour "<b>'+escHtml(query)+'</b>".');return;
}

function handleNewIntent(raw){

/* ===== EDITION D'UN CONTACT EXISTANT (ouvre la fenetre d'edition) ===== */

function foldersScope(){return S.df==='all'?FOLDERS.map(f=>f.key):[S.df];}

function genRecurring(task){
if(!task.repeat||task.repeat==='none')return[task.dueDate];
const dates=[];let cur=new Date(task.dueDate+'T00:00:00');const end=new Date((task.repeatEnd||'2099-12-31')+'T00:00:00');let guard=0;
while(cur<=end&&guard<2000){dates.push(localDateStr(cur));if(task.repeat==='daily')cur.setDate(cur.getDate()+1);else if(task.repeat==='weekly')cur.setDate(cur.getDate()+7);else if(task.repeat==='monthly')cur.setMonth(cur.getMonth()+1);else break;guard++;}
return dates;
}

function tasksOnDate(dateStr){
const out=[];
foldersScope().forEach(folder=>{
(D[folder]?.tasks||[]).forEach(task=>{
if(task.completed)return;
if(!task.dueDate)return;
const dates=genRecurring(task);
if(dates.includes(dateStr)){
const project=getProject(folder,task.projectId);
out.push({folder,task,projectName:project?project.name:'Projet',priority:task.priority||'medium'});
}
});
});
const order={high:0,medium:1,low:2};
out.sort((a,b)=>(order[a.priority]??1)-(order[b.priority]??1));
return out;
}

function completedOnDate(dateStr){return CL.filter(e=>e.date===dateStr).sort((a,b)=>(b.ts||0)-(a.ts||0));}

function tasksOverdue(dateStr){
const out=[];
foldersScope().forEach(folder=>{
(D[folder]?.tasks||[]).forEach(task=>{
if(task.completed)return;
if(!task.dueDate)return;
if(task.repeat&&task.repeat!=='none')return;
if(task.dueDate<dateStr){
const project=getProject(folder,task.projectId);
out.push({folder,task,projectName:project?project.name:'Projet',priority:task.priority||'medium',overdue:true});
}
});
});
out.sort((a,b)=>a.task.dueDate<b.task.dueDate?-1:a.task.dueDate>b.task.dueDate?1:0);
return out;
}

function buildDashCharts(scope){
const chartFont={family:"'Jost',sans-serif"};

const tickColor='#c9a97e';

/* Graphique 1 : Tâches complétées sur 7 jours */
const days=[];const completedData=[];const createdData=[];
for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=localDateStr(d);days.push(d.toLocaleDateString('fr',{weekday:'short'}));let cc=0,cr=0;scope.forEach(k=>{(D[k]?.tasks||[]).forEach(t=>{if(genRecurring(t).includes(ds)){if(t.completed)cc++;else cr++;}});});completedData.push(cc);createdData.push(cr);}
const ctx1=document.getElementById('chartCompleted');
if(ctx1){chartInstances.completed=new Chart(ctx1,{type:'line',data:{labels:days,datasets:[{label:'Complétées',data:completedData,borderColor:'#5fbf8f',backgroundColor:'rgba(95,191,143,.1)',fill:true,tension:.4,pointRadius:4,pointBackgroundColor:'#5fbf8f'},{label:'Actives',data:createdData,borderColor:'#9999ff',backgroundColor:'rgba(153,153,255,.08)',fill:true,tension:.4,pointRadius:4,pointBackgroundColor:'#9999ff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:tickColor,font:chartFont,boxWidth:12,padding:12}}},scales:{x:{ticks:{color:tickColor,font:{...chartFont,size:11}},grid:{color:gridColor}},y:{beginAtZero:true,ticks:{color:tickColor,font:{...chartFont,size:11},stepSize:1},grid:{color:gridColor}}}}});}

/* Graphique 2 : Projets par dossier */
const ctx2=document.getElementById('chartFolders');
if(ctx2){const labels=FOLDERS.map(f=>f.name);const data=FOLDERS.map(f=>(D[f.key]?.projects||[]).length);const colors=FOLDERS.map(f=>f.color);
chartInstances.folders=new Chart(ctx2,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors,borderColor:'#0d0d0d',borderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'right',labels:{color:tickColor,font:chartFont,boxWidth:10,padding:8}}}}});}

/* Graphique 3 : Priorités */
const ctx3=document.getElementById('chartPriority');
if(ctx3){let hi=0,md=0,lo=0;scope.forEach(k=>{(D[k]?.tasks||[]).forEach(t=>{if(!t.completed){if(t.priority==='high')hi++;else if(t.priority==='low')lo++;else md++;}});});

}

function getFilteredTasks(){
let out=[];
const scope=S.tf.folder==='all'?FOLDERS.map(f=>f.key):[S.tf.folder];
scope.forEach(folder=>{
(D[folder]?.tasks||[]).forEach(t=>{
out.push({folder,task:t,project:getProject(folder,t.projectId)});
});
});
if(S.tf.pri!=='all')out=out.filter(x=>(x.task.priority||'medium')===S.tf.pri);
if(S.tf.status!=='all')out=out.filter(x=>taskStatus(x.task)===S.tf.status);

if(q)out=out.filter(x=>x.task.name.toLowerCase().includes(q)||(x.task.description||'').toLowerCase().includes(q));
return out;
}

function rTasksList(items){
if(!items.length)return'<div class="text-mut text-sm text-center py-16">Aucune tâche pour ce filtre</div>';
const sorted=[...items].sort((a,b)=>{
if(!a.task.dueDate&&!b.task.dueDate)return 0;
if(!a.task.dueDate)return 1;
if(!b.task.dueDate)return -1;
return a.task.dueDate.localeCompare(b.task.dueDate);
});
return`<div class="flex flex-col gap-2">${sorted.map(taskRowMini).join('')}</div>`;
}

function rTasksKanban(items){
const cols=[{k:'todo',l:'À faire',c:'mut'},{k:'doing',l:'En cours',c:'inf'},{k:'done',l:'Terminé',c:'ok'}];
return`<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
${cols.map(col=>{
const colItems=items.filter(x=>taskStatus(x.task)===col.k);
return`<div class="bg-surface border border-bdr rounded-xl p-4">
<div class="flex items-center justify-between mb-3"><h3 class="font-disp font-semibold text-sm flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-${col.c}"></span>${col.l}</h3><span class="text-[.65rem] bg-sAlt px-2 py-0.5 rounded-full text-mut">${colItems.length}</span></div>
<div class="kc flex flex-col gap-2 p-1" data-status="${col.k}" ondragover="kbOver(event)" ondragleave="kbLeave(event)" ondrop="kbDrop(event,'${col.k}')">
${colItems.map(x=>{const f=fldr(x.folder);return`<div class="kd bg-sAlt border border-bdr rounded-lg p-3 cursor-pointer" draggable="true" ondragstart="kbStart(event,'${x.folder}',${x.task.id})" ondragend="kbEnd(event)" onclick="openTaskDetail('${x.folder}',${x.task.id})">
<div class="text-sm font-medium mb-1.5">${x.task.name}${x.task.gcalEventId?` <i class="fa-brands fa-google text-[.5rem] text-inf" title="Synchronisée avec Google Agenda"></i>`:''}</div>
<div class="flex flex-wrap gap-1.5"><span class="text-[.6rem] px-1.5 py-0.5 rounded-full bg-sHov text-mut">${f?f.name:x.folder}</span>${prBadge(x.task.priority)}${x.task.dueDate?`<span class="text-[.6rem] px-1.5 py-0.5 rounded-full bg-sHov text-mut">${fmtFr(x.task.dueDate)}</span>`:''}${x.task.reminderAt?`<span class="text-[.6rem] px-1.5 py-0.5 rounded-full bg-warnS text-warn"><i class="fa-solid fa-bell"></i></span>`:''}</div>
</div>`;}).join('')||'<div class="text-mut text-xs text-center py-6">Vide</div>'}
</div>
</div>`;

</div>`;

let kbDrag=null;
function kbStart(e,folder,tid){kbDrag={folder,tid};e.target.classList.add('dg');e.dataTransfer.effectAllowed='move';}
function kbEnd(e){e.target.classList.remove('dg');}
function kbOver(e){e.preventDefault();e.currentTarget.classList.add('do');}
function kbLeave(e){e.currentTarget.classList.remove('do');}
function kbDrop(e,status){
e.preventDefault();e.currentTarget.classList.remove('do');
if(!kbDrag)return;
const t=D[kbDrag.folder].tasks.find(x=>x.id===kbDrag.tid);
if(t){
t.status=status;t.completed=status==='done';
logCompletion(kbDrag.folder,t,S.v==='dash'?S.vd:todayStr());
svData();toast('Tâche déplacée : '+STATUS_L[status]);
}
kbDrag=null;
rTasks();
}

function rTasksTimeline(items){
const withDate=items.filter(x=>x.task.dueDate).sort((a,b)=>a.task.dueDate.localeCompare(b.task.dueDate));
const noDate=items.filter(x=>!x.task.dueDate);
const groups={};
withDate.forEach(x=>{(groups[x.task.dueDate]=groups[x.task.dueDate]||[]).push(x);});
const dates=Object.keys(groups);
if(!dates.length&&!noDate.length)return'<div class="text-mut text-sm text-center py-16">Aucune tâche pour ce filtre</div>';
const prColor={high:'#ff9c00',medium:'#ffcc66',low:'#c9a97e'};
let h='<div class="tl-wrap"><div class="tl-line"></div><div class="flex flex-col gap-6">';
dates.forEach(d=>{
const dt=new Date(d+'T00:00:00');
const overdue=dt<new Date(todayStr()+'T00:00:00');
h+=`<div class="relative"><span class="tl-dot" style="background:${overdue?'#ff9c00':'#9999ff'}"></span>
<div class="text-xs font-semibold text-txt mb-2">${fmtFr(d)} ${overdue?'<span class="text-acc">(en retard)</span>':''}</div>
<div class="flex flex-col gap-2">${groups[d].map(taskRowMini).join('')}</div></div>`;
});
if(noDate.length){
h+=`<div class="relative"><span class="tl-dot" style="background:#c9a97e"></span>
<div class="text-xs font-semibold text-mut mb-2">Sans échéance</div>
<div class="flex flex-col gap-2">${noDate.map(taskRowMini).join('')}</div></div>`;
}
h+='</div></div>';
return h;
}

function rTasks(){
const items=getFilteredTasks();
let body='';
if(S.tv==='kanban')body=rTasksKanban(items);
else if(S.tv==='timeline')body=rTasksTimeline(items);
else body=rTasksList(items);
let h=`<div class="max-w-7xl mx-auto">
<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 af"><div><h1 class="font-disp text-3xl font-bold tracking-tight">Tâches</h1><p class="text-mut text-sm mt-1">${items.length} tâche${items.length>1?'s':''}</p></div></div>
${rTasksFilterBar()}
${body}
</div>`;
document.getElementById('PC').innerHTML=h;
}

function svProject(e,folder,pid){
e.preventDefault();

Object.assign(p,o);

/* ===== GOOGLE AGENDA ===== */
function gcalUrl(task,projectName,folderName){
if(!task.dueDate)return null;
const startD=new Date(task.dueDate+'T00:00:00');
const endD=new Date(startD);endD.setDate(endD.getDate()+1);
const start=task.dueDate.replace(/-/g,'');
const end=localDateStr(endD).replace(/-/g,'');
let details=task.description||'';
if(projectName)details+=(details?'\n\n':'')+'Projet : '+projectName;
if(folderName)details+=(details?' ':'')+`(${folderName})`;
if(task.repeat&&task.repeat!=='none')details+=(details?'\n':'')+'Tâche récurrente : '+task.repeat;
const params=new URLSearchParams({action:'TEMPLATE',text:task.name,dates:`${start}/${end}`,details});
return`https://calendar.google.com/calendar/render?${params.toString()}`;
}
function addToGCal(folder,tid){
const t=D[folder].tasks.find(x=>x.id===tid);
if(!t)return;
if(!t.dueDate){toast('Ajoutez une échéance à la tâche avant de la synchroniser','err');return;}
const f=fldr(folder);
const project=getProject(folder,t.projectId);
const url=gcalUrl(t,project?project.name:null,f?f.name:folder);
window.open(url,'_blank','noopener');
}

/* ===== GOOGLE AGENDA — SYNCHRONISATION OAUTH ===== */
// Contrairement à addToGCal() ci-dessus (lien manuel, sans connexion), ce qui suit
// connecte réellement le compte Google et garde les tâches synchronisées automatiquement.

function saveGCalClientId(id){
    id=(id||'').trim();
    if(!id){toast('Merci de coller un Client ID valide','err');return;}
    GCAL.clientId=id;
    GCAL.tokenClient=null;
    localStorage.setItem('cdc_gcal_client_id',id);
    toast('Client ID enregistré');
    ren();
}
function forgetGCalClientId(){
    GCAL={clientId:'',token:null,tokenExpiry:0,tokenClient:null,connected:false,events:[],loading:false,view:'list',_viewDate:null};
    GMAIL={messages:[],labels:[],loading:false,query:'in:inbox',nextPageToken:null,_loaded:false,_openMsg:null,_selected:null};
    localStorage.removeItem('cdc_gcal_client_id');
    ren();
    toast('Configuration Google Agenda réinitialisée','info');
}
function gcalEnsureTokenClient(){
    if(typeof google==='undefined'||!google.accounts?.oauth2){
        toast('Google Identity Services indisponible (vérifie ta connexion internet)','err');
        return null;
    }
    if(!GCAL.tokenClient){
        GCAL.tokenClient=google.accounts.oauth2.initTokenClient({
            client_id:GCAL.clientId,
            scope:GCAL_SCOPE,
            callback:gcalAuthCallback
        });
    }
    return GCAL.tokenClient;
}
function gcalAuthCallback(resp){
    if(resp.error){
        toast('Connexion Google refusée ou annulée','err');
        ren();
        return;
    }
    GCAL.token=resp.access_token;
    GCAL.tokenExpiry=Date.now()+(resp.expires_in||3500)*1000;
    GCAL.connected=true;
    toast('Connecté à Google (Agenda + Gmail)');
    gcalFetchEvents();
}
function gcalConnect(){
    if(!GCAL.clientId){toast('Renseigne d\'abord ton Client ID Google','err');return;}
    const tc=gcalEnsureTokenClient();
    if(!tc)return;
    tc.requestAccessToken({prompt:GCAL.token?'':'consent'});
}
function gcalDisconnect(){
    if(GCAL.token&&typeof google!=='undefined'){
        try{google.accounts.oauth2.revoke(GCAL.token,()=>{});}catch(e){}
    }
    GCAL.token=null;GCAL.tokenExpiry=0;GCAL.connected=false;GCAL.events=[];
    GMAIL.messages=[];GMAIL.labels=[];GMAIL.nextPageToken=null;GMAIL._loaded=false;GMAIL.filter='all';
    ren();
    toast('Déconnecté de Google Agenda','info');
}
function gcalHasValidToken(){return GCAL.connected&&GCAL.token&&Date.now()<GCAL.tokenExpiry;}

async function gcalFetchEvents(_tMin,_tMax){
    if(!gcalHasValidToken())return;
    GCAL.loading=true;ren();
    try{
        const timeMin=_tMin||new Date().toISOString();
        const timeMax=_tMax||new Date(Date.now()+30*86400000).toISOString();
        const url=`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true&orderBy=startTime&maxResults=50`;
        const r=await fetch(url,{headers:{Authorization:'Bearer '+GCAL.token}});
        if(r.status===401){
            GCAL.connected=false;GCAL.token=null;
            toast('Session Google expirée, reconnecte-toi','err');
            GCAL.loading=false;ren();return;
        }
        if(!r.ok)throw new Error('HTTP '+r.status);
        const data=await r.json();
        GCAL.events=data.items||[];
    }catch(e){
        toast('Erreur de synchronisation Google Agenda','err');
    }
    GCAL.loading=false;ren();
}
function gcalEventDateLabel(ev){
    const d=ev.start?.date||ev.start?.dateTime;
    if(!d)return'';
    const isAllDay=!!ev.start?.date;
    const dt=new Date(d);
    if(isAllDay)return dt.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
    return dt.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' · '+dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
/* Regroupe les événements par jour (clé YYYY-MM-DD) en conservant l'ordre
   chronologique déjà fourni par l'API (orderBy=startTime). */
function gcalGroupEventsByDay(events){
    const groups=[];const byKey={};
    events.forEach(ev=>{
        const isAllDay=!!ev.start?.date;
        const key=isAllDay?ev.start.date:localDateStr(new Date(ev.start.dateTime));
        if(!byKey[key]){byKey[key]={key,events:[]};groups.push(byKey[key]);}

// Crée ou met à jour l'événement Google Agenda lié à une tâche du Cockpit
async function gcalSyncTask(folder,task){
    if(!gcalHasValidToken()){toast('Connecte-toi à Google Agenda depuis l\'onglet dédié pour synchroniser','err');return;}
    if(!task.dueDate){toast('Ajoute une échéance à la tâche pour la synchroniser','err');return;}
    const f=fldr(folder);
    const project=getProject(folder,task.projectId);
    const nextDay=new Date(task.dueDate+'T00:00:00');nextDay.setDate(nextDay.getDate()+1);
    let details=task.description||'';
    if(project)details+=(details?'\n\n':'')+'Projet : '+project.name;
    if(f)details+=(details?' ':'')+`(${f.name})`;
    const body={
        summary:task.name,
        description:details,
        start:{date:task.dueDate},
        end:{date:localDateStr(nextDay)}
    };
    try{
        let r;
        if(task.gcalEventId){
            r=await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${task.gcalEventId}`,{
                method:'PATCH',
                headers:{Authorization:'Bearer '+GCAL.token,'Content-Type':'application/json'},
                body:JSON.stringify(body)
            });
        }else{
            r=await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events',{
                method:'POST',
                headers:{Authorization:'Bearer '+GCAL.token,'Content-Type':'application/json'},
                body:JSON.stringify(body)
            });
        }
        if(r.status===401){GCAL.connected=false;GCAL.token=null;toast('Session Google expirée, reconnecte-toi','err');ren();return;}
        if(!r.ok)throw new Error('HTTP '+r.status);
        const ev=await r.json();
        task.gcalEventId=ev.id;
        svData();
        toast('Tâche synchronisée avec Google Agenda');
        gcalFetchEvents();
    }catch(e){
        toast('Échec de la synchronisation Google Agenda','err');
    }
}
async function gcalDeleteTaskEvent(eventId){
    if(!eventId||!gcalHasValidToken())return;
    try{
        await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`,{
            method:'DELETE',
            headers:{Authorization:'Bearer '+GCAL.token}
        });
        gcalFetchEvents();
    }catch(e){/* silencieux : suppression best-effort */}
}

async function gmailFetchMessages(reset){
if(!gcalHasValidToken())return;
if(reset){GMAIL.messages=[];GMAIL.nextPageToken=null;GMAIL._selected=null;}
GMAIL.loading=true;ren();
try{
const params=new URLSearchParams({maxResults:'25',q:GMAIL.query||''});
if(!reset&&GMAIL.nextPageToken)params.set('pageToken',GMAIL.nextPageToken);
const r=await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages?${params}`,{headers:{Authorization:'Bearer '+GCAL.token}});
if(r.status===401){GCAL.connected=false;GCAL.token=null;toast('Session Google expirée, reconnecte-toi','err');GMAIL.loading=false;ren();return;}
if(!r.ok)throw new Error('HTTP '+r.status);
const data=await r.json();
GMAIL.nextPageToken=data.nextPageToken||null;
const ids=(data.messages||[]).map(m=>m.id);
const details=await Promise.all(ids.map(id=>
fetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${id}?format=metadata&metadataHeaders=Subject&metadataHeaders=From&metadataHeaders=Date`,{headers:{Authorization:'Bearer '+GCAL.token}}).then(rr=>rr.ok?rr.json():null).catch(()=>null)
));
const parsed=details.filter(Boolean).map(m=>{
const h=(m.payload&&m.payload.headers)||[];
const get=n=>{const x=h.find(x=>x.name===n);return x?x.value:'';};
return{
id:m.id,threadId:m.threadId,
subject:get('Subject')||'(Sans objet)',
from:get('From'),
date:get('Date'),
snippet:m.snippet||'',
unread:(m.labelIds||[]).includes('UNREAD'),
labelIds:m.labelIds||[]
};
});
GMAIL.messages=reset?parsed:GMAIL.messages.concat(parsed);
}catch(e){toast('Erreur de chargement Gmail','err');}
GMAIL.loading=false;ren();
}

function gmailGroupByDay(messages){
const groups=[];const byKey={};
messages.forEach(m=>{

byKey[key].messages.push(m);

function gmailFromName(from){
const m=/^"?([^"<]*)"?\s*<?/.exec(from||'');
const name=(m&&m[1]||'').trim();

function gmailDateLabel(dateStr){
try{const d=new Date(dateStr);return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}catch(e){return'';}
}
function gmailDecodeB64(data){try{return decodeURIComponent(escape(atob(data.replace(/-/g,'+').replace(/_/g,'/'))));}catch(e){try{return atob(data.replace(/-/g,'+').replace(/_/g,'/'));}catch(e2){return'';}}}
/* Parcourt récursivement l'arbre MIME (multipart/mixed peut contenir un
   multipart/alternative, lui-même contenant text/plain + text/html, à
   n'importe quel niveau) et renvoie le premier texte brut et le premier
   HTML trouvés. L'ancienne version ne regardait qu'un seul niveau de
   profondeur, ce qui ratait le corps de nombreux emails avec pièces jointes. */
function gmailWalkParts(payload,acc){
if(!payload)return acc;
if(payload.mimeType==='text/plain'&&!acc.text&&payload.body&&payload.body.data)acc.text=gmailDecodeB64(payload.body.data);
if(payload.mimeType==='text/html'&&!acc.html&&payload.body&&payload.body.data)acc.html=gmailDecodeB64(payload.body.data);

   HTML actif (aucun risque d'exécution). Sans ça, ces entités restaient
   affichées telles quelles dans le texte brut, rendant l'email illisible. */
function gmailDecodeEntities(str){
const ta=document.createElement('textarea');
ta.innerHTML=str;
return ta.value;
}
/* Repli texte brut à partir du HTML quand aucune partie text/plain n'existe :
   dépouille les balises tout en préservant les sauts de paragraphe, décode
   les entités, puis compresse les lignes vides en excès. */
function gmailPlainTextFromHtml(html){
let t=html.replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|tr|table|h[1-6])>/gi,'\n').replace(/<[^>]+>/g,'');
t=gmailDecodeEntities(t);

/* Neutralise scripts et gestionnaires d'événements avant d'injecter le HTML

function gmailSanitizeHtml(html){

.replace(/ on[a-z]+\s*=\s*"[^"]*"/gi,'')
.replace(/ on[a-z]+\s*=\s*'[^']*'/gi,'')
.replace(/javascript:/gi,'');
}

const ev=GCAL.events.find(e=>e.id===id);

function gcalOpenEventModal(ev){
const isEdit=!!(ev&&ev.id);
const start=ev&&ev.start?(ev.start.dateTime||ev.start.date):'';
const isAllDay=!!(ev&&ev.start&&ev.start.date);
const dateVal=start?start.slice(0,10):localDateStr(new Date());
const timeVal=(!isAllDay&&start)?start.slice(11,16):'';
opM(`<div class="p-6">
<h2 class="font-disp font-bold text-lg mb-4">${isEdit?'Modifier l\u2019événement':'Nouvel événement'}</h2>
<div class="flex flex-col gap-3">
<div><label class="text-xs font-medium text-mut mb-1.5 block">Titre</label><input id="gcTitle" class="fi text-sm" value="${escHtml(ev?ev.summary||'':'')}" placeholder="Titre de l'événement"></div>
<div class="grid grid-cols-2 gap-3">
<div><label class="text-xs font-medium text-mut mb-1.5 block">Date</label><input type="date" id="gcDate" class="fi text-sm" value="${dateVal}"></div>
<div><label class="text-xs font-medium text-mut mb-1.5 block">Heure (vide = journée entière)</label><input type="time" id="gcTime" class="fi text-sm" value="${timeVal}"></div>
</div>

<div class="flex flex-wrap justify-end gap-2 mt-5">
${isEdit?`<button onclick="clsM();gcalDeleteEventGeneric('${ev.id}')" class="h-10 px-4 rounded-xl bg-accS text-acc text-sm font-medium hover:bg-accS/70 transition-colors bp mr-auto">Supprimer</button>`:''}

<button onclick="gcalSaveEventFromModal(${isEdit?`'${ev.id}'`:'null'})" class="h-10 px-5 rounded-xl bg-acc hover:bg-accH text-black text-sm font-semibold transition-colors bp">${isEdit?'Enregistrer':'Créer'}</button>
</div>
</div>`);
}
async function gcalSaveEventFromModal(eventId){
if(!gcalHasValidToken()){toast('Connecte-toi à Google Agenda','err');return;}
const title=document.getElementById('gcTitle').value.trim();
const date=document.getElementById('gcDate').value;
const time=document.getElementById('gcTime').value;
const desc=document.getElementById('gcDesc').value;
if(!title||!date){toast('Titre et date requis','err');return;}
const body={summary:title,description:desc};
if(time){
const startDt=new Date(date+'T'+time+':00');
const endDt=new Date(startDt.getTime()+60*60000);
body.start={dateTime:startDt.toISOString()};
body.end={dateTime:endDt.toISOString()};
}else{
const nextDay=new Date(date+'T00:00:00');nextDay.setDate(nextDay.getDate()+1);
body.start={date:date};
body.end={date:localDateStr(nextDay)};
}
try{
const url='https://www.googleapis.com/calendar/v3/calendars/primary/events'+(eventId?'/'+eventId:'');
const r=await fetch(url,{method:eventId?'PATCH':'POST',headers:{Authorization:'Bearer '+GCAL.token,'Content-Type':'application/json'},body:JSON.stringify(body)});
if(r.status===401){GCAL.connected=false;GCAL.token=null;toast('Session Google expirée, reconnecte-toi','err');ren();return;}
if(!r.ok)throw new Error('HTTP '+r.status);
clsM();
toast(eventId?'Événement modifié':'Événement créé');
gcalFetchEvents();
}catch(e){toast('Échec de l\u2019enregistrement de l\u2019événement','err');}
}
async function gcalDeleteEventGeneric(eventId){
if(!gcalHasValidToken())return;
try{
const r=await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`,{method:'DELETE',headers:{Authorization:'Bearer '+GCAL.token}});

function linkedinSlugToName(url){
try{
const m=String(url).match(/linkedin\.[a-z.]+\/in\/([^/?#]+)/i);
if(!m)return'';
let parts=decodeURIComponent(m[1]).split('-').filter(Boolean);
parts=parts.filter(p=>!(/\d/.test(p)&&p.length>=6));
if(!parts.length)return'';
return parts.map(p=>p.charAt(0).toUpperCase()+p.slice(1)).join(' ');
}catch(e){return'';}
}
function autofillFromLinkedIn(el){
const guess=linkedinSlugToName(el.value.trim());
if(!guess)return;
const form=el.form;
if(form){const parts=guess.split(/\s+/);const fi=form.querySelector('[name="firstName"]');const li=form.querySelector('[name="lastName"]');if(fi&&!fi.value.trim()){fi.value=parts[0]||'';fi.focus();fi.select();}if(li&&!li.value.trim()&&parts.length>1){li.value=parts.slice(1).join(' ');}}
}
function toggleLIPaste(){
const el=document.getElementById('cLIPaste');
if(!el)return;
el.classList.toggle('hidden');
if(!el.classList.contains('hidden')){const ta=document.getElementById('cLIPasteTxt');if(ta)ta.focus();}
}
function parseLIPasteText(text){
const out={firstName:'',lastName:'',title:'',company:'',linkedin:''};
(text||'').split('\n').forEach(line=>{
const m=line.match(/^\s*(nom|name)\s*:\s*(.*)$/i);if(m){const parts=m[2].trim().split(/\s+/);out.firstName=parts[0]||'';out.lastName=parts.slice(1).join(' ')||'';return;}
const m2=line.match(/^\s*(titre|title|poste)\s*:\s*(.*)$/i);if(m2){out.title=m2[2].trim();return;}
const m3=line.match(/^\s*(entreprise|company|société|societe)\s*:\s*(.*)$/i);if(m3){out.company=m3[2].trim();return;}
const m4=line.match(/^\s*(linkedin|url)\s*:\s*(.*)$/i);if(m4){out.linkedin=m4[2].trim();return;}
});
return out;
}
function applyLIPaste(){
const ta=document.getElementById('cLIPasteTxt');
if(!ta)return;
const parsed=parseLIPasteText(ta.value);
if(!parsed.firstName&&!parsed.lastName&&!parsed.title&&!parsed.company&&!parsed.linkedin){toast('Aucune info reconnue dans le texte collé','info');return;}
const form=ta.closest('form');
const set=(sel,val)=>{if(!val)return false;const inp=form.querySelector(sel);if(inp&&!inp.value.trim()){inp.value=val;return true;}return false;};
let n=0;
if(set('[name="firstName"]',parsed.firstName))n++;
if(set('[name="lastName"]',parsed.lastName))n++;
if(set('[name="title"]',parsed.title))n++;
if(set('[name="company"]',parsed.company))n++;
if(set('#cLinkedin',parsed.linkedin))n++;
toast(n>0?`${n} champ${n>1?'s':''} rempli${n>1?'s':''}`:'Champs déjà remplis — rien à écraser','info');
document.getElementById('cLIPaste').classList.add('hidden');
ta.value='';
}

function parseContactLine(line){
let parts;
if(line.includes('\t'))parts=line.split('\t');
else if(line.includes('|'))parts=line.split('|');
else if(line.includes(';'))parts=line.split(';');
else parts=[line];
parts=parts.map(p=>(p||'').trim());
return{name:parts[0]||'',title:parts[1]||'',company:parts[2]||'',email:parts[3]||'',phone:parts[4]||'',notes:parts[5]||''};
}

function handleLinkedInFile(input){
const file=input.files&&input.files[0];
if(!file)return;
const reader=new FileReader();
reader.onload=function(ev){
const ta=document.getElementById('liBulk');
if(ta)ta.value=ev.target.result;
};
reader.onerror=function(){toast('Impossible de lire ce fichier','info');};
reader.readAsText(file,'UTF-8');
}
function parseCSVLine(line){
const out=[];let cur='';let inQ=false;
for(let i=0;i<line.length;i++){
const ch=line[i];
if(inQ){
if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else inQ=false;}
else cur+=ch;
}else{
if(ch==='"')inQ=true;
else if(ch===','){out.push(cur);cur='';}
else cur+=ch;
}
}
out.push(cur);
return out.map(s=>s.trim());
}
function importLinkedInContacts(e,folder,pid){
e.preventDefault();
const f=new FormData(e.target);
const raw=(f.get('bulk')||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
const lines=raw.split('\n').filter(l=>l.trim().length>0);
let headerIdx=lines.findIndex(l=>/first\s*name/i.test(l)&&/last\s*name/i.test(l));
if(headerIdx===-1){
svData();clsM();
toast('En-tête introuvable — vérifie que c\'est bien le fichier Connections.csv','info');
return;
}
const header=parseCSVLine(lines[headerIdx]).map(h=>h.toLowerCase());
const col=name=>header.findIndex(h=>h.includes(name));
const iFirst=col('first name'),iLast=col('last name'),iUrl=col('url'),iEmail=col('email'),iCompany=col('company'),iPosition=col('position');
let added=0,skipped=0;
for(let i=headerIdx+1;i<lines.length;i++){
const cols=parseCSVLine(lines[i]);
const first=iFirst>=0?(cols[iFirst]||''):'';
const last=iLast>=0?(cols[iLast]||''):'';
const name=(first+' '+last).trim();
if(!name)continue;
const url=iUrl>=0?(cols[iUrl]||''):'';
const candidate={name,company:iCompany>=0?(cols[iCompany]||''):'',email:iEmail>=0?(cols[iEmail]||''):'',linkedin:url||''};
if(findDupeContact(folder,candidate)){skipped++;continue;}
const c={id:gid(D[folder].contacts),firstName:first,lastName:last,name,title:iPosition>=0?(cols[iPosition]||''):'',company:candidate.company,email:candidate.email,phone:'',linkedin:url||'',notes:'',projectId:pid};
D[folder].contacts.push(c);
added++;
}
svData();clsM();
toast(added>0?`${added} contact${added>1?'s':''} importé${added>1?'s':''} depuis LinkedIn${skipped>0?` · ${skipped} doublon${skipped>1?'s':''} ignoré${skipped>1?'s':''}`:''}`:(skipped>0?`Aucun contact importé — ${skipped} doublon${skipped>1?'s':''} déjà présent${skipped>1?'s':''}`:'Aucun contact trouvé dans ce fichier'),'info');
ren();
}

/* ===== GESTION FICHIERS/RESSOURCES ===== */
function getFileType(name){const ext=(name||'').toLowerCase().split('.').pop();if(ext==='pdf')return'pdf';if(ext==='html'||ext==='htm')return'html';if(['png','jpg','jpeg','gif','webp','svg'].includes(ext))return'image';return'other';}
function getFileIcon(type){if(type==='pdf')return{icon:'fa-file-pdf',color:'text-acc',bg:'bg-accS'};if(type==='html')return{icon:'fa-file-code',color:'text-inf',bg:'bg-infS'};if(type==='image')return{icon:'fa-file-image',color:'text-ok',bg:'bg-okS'};return{icon:'fa-file',color:'text-mut',bg:'bg-sAlt'};}
function formatFileSize(bytes){if(bytes<1024)return bytes+' o';if(bytes<1048576)return(bytes/1024).toFixed(1)+' Ko';return(bytes/1048576).toFixed(1)+' Mo';}

function readFileAsBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});}

function dataUrlToBlob(dataUrl){
const commaIdx=dataUrl.indexOf(',');
const header=dataUrl.slice(5,commaIdx);
const isB64=/;base64$/i.test(header);
const mime=(header.split(';')[0]||'application/octet-stream').trim()||'application/octet-stream';
const payload=dataUrl.slice(commaIdx+1);
let byteString=isB64?atob(payload):decodeURIComponent(payload);
const bytes=new Uint8Array(byteString.length);
for(let i=0;i<byteString.length;i++)bytes[i]=byteString.charCodeAt(i);
return new Blob([bytes],{type:mime});
}
function downloadBlob(blobUrl,fileName){const a=document.createElement('a');a.href=blobUrl;a.download=fileName;document.body.appendChild(a);a.click();a.remove();}
function extFromMime(mime){const m={'application/pdf':'.pdf','text/html':'.html','text/plain':'.txt','text/csv':'.csv','image/png':'.png','image/jpeg':'.jpg','image/gif':'.gif','image/webp':'.webp','image/svg+xml':'.svg','application/json':'.json','application/zip':'.zip','application/msword':'.doc','application/vnd.openxmlformats-officedocument.wordprocessingml.document':'.docx','application/vnd.ms-excel':'.xls','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'.xlsx'};return m[mime]||'';}
function ensureExt(name,mime){if(!name)name='fichier';if(/\.[a-z0-9]{2,5}$/i.test(name))return name;const ext=extFromMime(mime);return ext?name+ext:name;}

function openResourceFile(folder,fid){
const file=D[folder].files.find(x=>x.id===fid);
if(!file)return;
const raw=file.url||'';
if(!raw)return;
const url=raw.startsWith('data:')?raw:(!/^[a-z][a-z0-9+.-]*:/i.test(raw)?'https://'+raw:raw);
if(url.startsWith('data:')){
try{
const blob=dataUrlToBlob(url);
const blobUrl=URL.createObjectURL(blob);
const viewable=blob.type.startsWith('text/')||blob.type.startsWith('image/')||blob.type==='application/pdf';
if(viewable){const win=window.open(blobUrl,'_blank','noopener');if(!win)downloadBlob(blobUrl,ensureExt(file.name,blob.type));}
else downloadBlob(blobUrl,ensureExt(file.name,blob.type));
setTimeout(()=>URL.revokeObjectURL(blobUrl),60000);
}catch(err){toast("Impossible d'ouvrir ce fichier",'err');}
}else{
window.open(url,'_blank','noopener,noreferrer');
}
}

function openImp(){
opM(`<div class="p-6"><h2 class="font-disp font-bold text-lg mb-5">Importer des données</h2>

</div>`);

function handleImport(ev){
const file=ev.target.files[0];if(!file)return;
const reader=new FileReader();
reader.onload=e=>{
try{
const imp=JSON.parse(e.target.result);
if(!imp||typeof imp!=='object'){toast('Format invalide','err');return;}
if(imp.folders&&imp.data){
FOLDERS=imp.folders;D=imp.data;CL=imp.completedLog||[];if(imp.settings)SET=imp.settings;
if(imp.notesData&&typeof ND!=='undefined'){ND.notes=imp.notesData.notes||ND.notes;ND.categories=imp.notesData.categories||ND.categories;ND.tags=imp.notesData.tags||ND.tags;}
}else{
toast('Fichier incomplet','err');return;
}
/* Bloquer onSnapshot pour empêcher l'écrasement des données importées
   par les anciennes données du cloud pendant que le push est en cours */
_fbImporting=true;
svFolders();svData();svLog();svSettings();if(typeof svNotesData==='function')svNotesData();
/* Annuler tout fbQueuePush en attente APRÈS les sauvegardes
   (car chaque sv*() appelle fbQueuePush) pour éviter qu'il pousse
   les anciennes données après le push forcé */
if(typeof fbCancelQueuedPush==='function')fbCancelQueuedPush();
toast('Données importées !');
clsM();
/* IMPORTANT : on garde _fbImporting=true jusqu'au reload effectif
   pour empêcher onSnapshot d'écraser les données pendant la fenêtre
   de 800ms avant le reload */
var _doReload=function(){setTimeout(()=>location.reload(),200);};
if(typeof fbPush==='function'&&fbIsReady()){
toast('Synchronisation cloud en cours...','info');
/* Force push : on veut écraser le cloud avec les données importées,
   pas demander confirmation de conflit */
var _safety=setTimeout(_doReload,12000);
fbPush(true).then(function(ok){
clearTimeout(_safety);
if(ok)toast('Import synchronisé sur le cloud','info');
else toast('Import local OK, mais le push cloud a échoué','err');
_doReload();
}).catch(function(){
clearTimeout(_safety);
toast('Import local OK, mais le push cloud a échoué','err');
_doReload();
});
}else{
_doReload();
}
}catch(err){_fbImporting=false;toast('Erreur : '+err.message,'err');}
};
reader.readAsText(file);
}

const LOGO_TYPES=['image/png','image/jpeg','image/gif','image/svg+xml','image/webp','image/x-icon','image/vnd.microsoft.icon'];
const MAX_LOGO_DIM=350;
function handleLogoFile(input){
const file=input.files&&input.files[0];
if(!file)return;
if(!LOGO_TYPES.includes(file.type)){toast('Format non supporté (PNG, JPG, GIF, SVG, WEBP, ICO)','err');input.value='';return;}
const isGif=file.type==='image/gif';
if(file.size>(isGif?1500000:4000000)){toast(`Fichier trop lourd (max ~${isGif?'1,5':'4'} Mo)`,'err');input.value='';return;}
const reader=new FileReader();
reader.onload=e=>{
const dataUrl=e.target.result;
const img=new Image();
img.onload=()=>{
const w=img.naturalWidth,h=img.naturalHeight;
if(w<=MAX_LOGO_DIM&&h<=MAX_LOGO_DIM){saveLogoImg(dataUrl);return;}
if(isGif){
toast(`GIF trop grand (${w}×${h}px, max ${MAX_LOGO_DIM}px). Redimensionnez-le avant import pour conserver l'animation.`,'err');
input.value='';
return;
}
const scale=Math.min(MAX_LOGO_DIM/w,MAX_LOGO_DIM/h);
const nw=Math.max(1,Math.round(w*scale)),nh=Math.max(1,Math.round(h*scale));
const canvas=document.createElement('canvas');
canvas.width=nw;canvas.height=nh;
const ctx=canvas.getContext('2d');
ctx.drawImage(img,0,0,nw,nh);
const outType=file.type==='image/jpeg'?'image/jpeg':'image/png';
const resized=canvas.toDataURL(outType,0.92);
saveLogoImg(resized,`Image redimensionnée automatiquement (${w}×${h} → ${nw}×${nh}px)`);
};
img.onerror=()=>toast('Impossible de lire cette image','err');
img.src=dataUrl;
};
reader.onerror=()=>toast('Erreur de lecture du fichier','err');
reader.readAsDataURL(file);
}
function saveLogoImg(dataUrl,msg){
SET.logoImg=dataUrl;
try{svSettings();}catch(err){toast('Stockage plein : image trop grande pour être sauvegardée','err');return;}
applyLogo();
openSettingsM();
toast(msg||'Logo mis à jour');
}

    n.excerpt = (n.content||'').replace(/[#*`\[\]>|_\-~]/g,'').replace(/\n+/g,' ').trim().slice(0,120);
  });
  svNotesData();
}

/* ── Utility ───────────────────────────────────────────────── */
function noteExcerpt(c) { return (c||'').replace(/[#*`\[\]>|_\-~]/g,'').replace(/\n+/g,' ').trim().slice(0,120); }
function noteWC(c) { return (c||'').split(/\s+/).filter(Boolean).length; }
function timeAgo(ts) {
  const d = Date.now()-ts, m=Math.floor(d/60000), h=Math.floor(d/3600000), j=Math.floor(d/86400000);
  if(m<1) return "À l'instant"; if(m<60) return m+' min'; if(h<24) return h+' h'; if(j<30) return j+' j'; if(j<365) return Math.floor(j/30)+' mois'; return Math.floor(j/365)+' an'+(Math.floor(j/365)>1?'s':'');
}
function escH(s) { return typeof escHtml==='function'?escHtml(s):String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── Markdown Renderer ─────────────────────────────────────── */
function mdRender(md) {
  if(!md) return '';
  let h = md;
  // code blocks
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_,lang,code)=>'<pre style="background:#141414;border:1px solid #2b2b2b;border-radius:8px;padding:12px;overflow-x:auto;margin:8px 0"><code'+(lang?' class="language-'+lang+'"':'')+'>'+escH(code.trim())+'</code></pre>');
  // inline code
  h = h.replace(/`([^`]+)`/g,'<code style="background:#141414;padding:2px 6px;border-radius:4px;font-size:0.9em">$1</code>');
  // headings
  h = h.replace(/^### (.+)$/gm,'<h3 style="font-size:1.1em;color:#c9a97e;margin:12px 0 4px;font-family:Antonio,sans-serif;letter-spacing:0.04em">$1</h3>');
  h = h.replace(/^## (.+)$/gm,'<h2 style="font-size:1.3em;color:#f2ead8;margin:16px 0 6px;font-family:Antonio,sans-serif;letter-spacing:0.04em">$1</h2>');
  h = h.replace(/^# (.+)$/gm,'<h1 style="font-size:1.6em;color:#ff9c00;margin:20px 0 8px;font-family:Antonio,sans-serif;letter-spacing:0.05em">$1</h1>');
  // bold + italic
  h = h.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  h = h.replace(/\*\*(.+?)\*\*/g,'<strong style="color:#f2ead8">$1</strong>');
  h = h.replace(/\*(.+?)\*/g,'<em>$1</em>');
  // strikethrough
  h = h.replace(/~~(.+?)~~/g,'<del>$1</del>');
  // hr
  h = h.replace(/^---+$/gm,'<hr style="border:none;border-top:1px solid #2b2b2b;margin:16px 0">');
  // blockquote
  h = h.replace(/^> (.+)$/gm,'<blockquote style="border-left:3px solid #ff9c00;padding:4px 12px;margin:8px 0;color:#c9a97e;font-style:italic">$1</blockquote>');
  // table
  h = h.replace(/^(\|.+\|)\n(\|[-| :]+\|)\n((?:\|.+\|\n?)*)/gm, (_,hdr,sep,body)=>{
    const ths=hdr.split('|').filter(Boolean).map(t=>'<th style="padding:6px 10px;border:1px solid #2b2b2b;color:#ff9c00;text-align:left;font-family:Antonio,sans-serif;letter-spacing:0.04em">'+t.trim()+'</th>').join('');
    const rows=body.trim().split('\n').map(r=>{
      const tds=r.split('|').filter(Boolean).map(t=>'<td style="padding:6px 10px;border:1px solid #2b2b2b;color:#c9a97e">'+t.trim()+'</td>').join('');
      return '<tr>'+tds+'</tr>';
    }).join('');
    return '<table style="border-collapse:collapse;margin:8px 0;width:100%"><thead><tr>'+ths+'</tr></thead><tbody>'+rows+'</tbody></table>';
  });
  // checklist
  h = h.replace(/^- \[x\] (.+)$/gm,'<div style="margin:2px 0"><label style="color:#5fbf8f;cursor:default"><input type="checkbox" checked disabled style="margin-right:6px;accent-color:#ff9c00">$1</label></div>');
  h = h.replace(/^- \[ \] (.+)$/gm,'<div style="margin:2px 0"><label style="color:#c9a97e;cursor:default"><input type="checkbox" disabled style="margin-right:6px;accent-color:#ff9c00">$1</label></div>');
  // unordered list
  h = h.replace(/^- (.+)$/gm,'<li style="color:#c9a97e;margin:2px 0 2px 16px">$1</li>');
  // ordered list
  h = h.replace(/^\d+\. (.+)$/gm,'<li style="color:#c9a97e;margin:2px 0 2px 16px;list-style-type:decimal">$1</li>');
  // links
  h = h.replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" style="color:#ff9c00;text-decoration:underline" target="_blank">$1</a>');
  // paragraphs
  h = h.replace(/\n{2,}/g,'<br><br>');
  h = h.replace(/\n/g,'<br>');
  return h;
}

  // Close menus on outside click

    document.querySelectorAll('[id^="nmenu_"]').forEach(el=>{ if(!el.classList.contains('n-hidden')) el.classList.add('n-hidden'); });

/* ── Editor keyboard shortcuts ─────────────────────────────── */
function nEditorKeyHandler(e) {
  if (S.v !== 'notes' || !NS.isEditorOpen) return;
  const isMod = e.ctrlKey || e.metaKey;
  if (isMod && e.key === 'p') { e.preventDefault(); nPrintNote(NS.selectedNoteId); }
  if (isMod && e.shiftKey && e.key === 'Delete') { e.preventDefault(); nDeleteConfirm(NS.selectedNoteId); }
  if (isMod && e.shiftKey && e.key === 'C') { e.preventDefault(); nCopyContent(NS.selectedNoteId); }
  if (isMod && e.key === 'Backslash') { e.preventDefault(); NS.isFullscreen=!NS.isFullscreen; rNoteEditor(); }
  if (e.key === 'Escape' && NS.isFullscreen) { NS.isFullscreen=false; rNoteEditor(); }
}

/* ── Sidebar toggle ────────────────────────────────────────── */
function nToggleSidebar() {
  const sb = document.getElementById('nSidebar');
  if (!sb) return;
  if (sb.style.width === '0px') {
    sb.style.width = '220px'; sb.style.minWidth = '220px'; sb.style.padding = '12px'; sb.style.overflow = 'auto';
  } else {
    sb.style.width = '0px'; sb.style.minWidth = '0px'; sb.style.padding = '0'; sb.style.overflow = 'hidden';
  }
}

/* ── Field updates ─────────────────────────────────────────── */
function nUpdateField(id, field, value) {

  n.updatedAt = Date.now();
  n.wordCount = noteWC(n.content);

function nOnProjectChange(id) {

function nUpdateContent(id, value) {

}

/* ── Markdown insertion ────────────────────────────────────── */
function nInsertMd(md, mdEnd, isPre, isLine) {
  const ta = document.getElementById('nContent');
  if (!ta) return;
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  const val = ta.value;
  const sel = val.substring(start, end);

  if (isLine) {
    // Find line start
    const lineStart = val.lastIndexOf('\n', start-1)+1;
    const lineEnd = val.indexOf('\n', end);
    const line = val.substring(lineStart, lineEnd===-1?val.length:lineEnd);
    const before = val.substring(0, lineStart);
    const after = val.substring(lineEnd===-1?val.length:lineEnd);
    const newLine = md + line + (mdEnd||'');
    ta.value = before + newLine + after;
    ta.selectionStart = ta.selectionEnd = lineStart + newLine.length;
  } else {
    const replacement = md + sel + (mdEnd||'');
    ta.value = val.substring(0, start) + replacement + val.substring(end);
    ta.selectionStart = start + md.length;
    ta.selectionEnd = start + md.length + sel.length;
  }
  ta.focus();
  nUpdateContent(NS.selectedNoteId, ta.value);
}

/* ── Slash Commands ────────────────────────────────────────── */
const SLASH_ITEMS = [
  { label:'Titre 1',  icon:'fa-heading', md:'# ',   desc:'Grand titre' },
  { label:'Titre 2',  icon:'fa-heading', md:'## ',  desc:'Titre moyen', suffix:'2' },
  { label:'Titre 3',  icon:'fa-heading', md:'### ', desc:'Petit titre', suffix:'3' },
  { label:'Liste',     icon:'fa-list-ul', md:'- ',   desc:'Liste à puces' },
  { label:'Liste numérotée', icon:'fa-list-ol', md:'1. ', desc:'Liste numérotée' },
  { label:'Citation',  icon:'fa-quote-left', md:'> ', desc:'Bloc de citation' },
  { label:'Code bloc', icon:'fa-code', md:'```\n', desc:'Bloc de code', mdEnd:'\n```' },
  { label:'Checklist', icon:'fa-square-check', md:'- [ ] ', desc:'Liste de tâches' },
  { label:'Séparateur',icon:'fa-minus', md:'---\n', desc:'Ligne horizontale' },
  { label:'Tableau',   icon:'fa-table', md:'| Col1 | Col2 | Col3 |\n|------|------|------|\n| ', desc:'Tableau', mdEnd:' | data | data |' },
];

function nSlashHandler(e) {
  if (e.key === 'Escape') { nHideSlash(); return; }
  const menu = document.getElementById('nSlashMenu');
  if (!menu || menu.classList.contains('hidden')) return;
  if (e.key === 'Enter') {
    e.preventDefault();
    const sel = menu.querySelector('[data-slash-sel="true"]') || menu.querySelector('[data-slash-idx="0"]');
    if (sel) sel.click();
    nHideSlash();
  } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const items = menu.querySelectorAll('[data-slash-idx]');
    let cur = -1;
    items.forEach((it,i)=>{ if(it.dataset.slashSel==='true') cur=i; });
    items.forEach(it=>it.dataset.slashSel='false');
    const next = e.key==='ArrowDown' ? (cur+1)%items.length : (cur-1+items.length)%items.length;
    const target = items[next];
    if (target) { target.dataset.slashSel='true'; target.style.background='#1a1a1a'; }
    items.forEach((it,i)=>{ if(i!==next) it.style.background='none'; });
  }
}

function nSlashInput(e) {
  const ta = e.target;
  const val = ta.value;
  const pos = ta.selectionStart;
  // Find slash before cursor
  const before = val.substring(0, pos);
  const slashIdx = before.lastIndexOf('/');
  if (slashIdx === -1 || (slashIdx > 0 && before[slashIdx-1] !== '\n' && before[slashIdx-1] !== ' ')) { nHideSlash(); return; }
  // Check if there's a newline between slash and cursor
  const between = before.substring(slashIdx+1);
  if (between.includes('\n')) { nHideSlash(); return; }
  const query = between.toLowerCase().trim();
  const menu = document.getElementById('nSlashMenu');
  if (!menu) return;

  const filtered = SLASH_ITEMS.filter(it=>it.label.toLowerCase().includes(query) || it.desc.toLowerCase().includes(query));
  if (filtered.length === 0) { nHideSlash(); return; }

  NS._slashRange = { start: slashIdx, end: pos };
  menu.classList.remove('hidden');

  // Position: estimate from textarea
  const linesBefore = val.substring(0, slashIdx).split('\n');
  const lineCount = linesBefore.length;
  const topOffset = 40 + lineCount * 24;
  menu.style.top = topOffset + 'px';

  menu.innerHTML = filtered.map((it,i)=>`
    <div data-slash-idx="${i}" data-slash-sel="${i===0}" onclick="nSlashSelect(${SLASH_ITEMS.indexOf(it)})" style="display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;transition:background .1s;${i===0?'background:#1a1a1a':''}" onmouseover="this.style.background='#1a1a1a'" onmouseout="this.style.background='${i===0?'#1a1a1a':'none'}'">
      <i class="fa-solid ${it.icon}" style="width:18px;color:#ff9c00;font-size:0.8rem"></i>
      <div><div style="font-size:0.82rem;color:#f2ead8">${escH(it.label)}</div><div style="font-size:0.68rem;color:#666">${escH(it.desc)}</div></div>
    </div>
  `).join('');
}

function nSlashSelect(idx) {
  const item = SLASH_ITEMS[idx];
  if (!item || !NS._slashRange) return;
  const ta = document.getElementById('nContent');
  if (!ta) return;
  const {start, end} = NS._slashRange;
  const val = ta.value;
  const mdEnd = item.mdEnd || '';
  ta.value = val.substring(0, start) + item.md + mdEnd + val.substring(end);
  ta.selectionStart = ta.selectionEnd = start + item.md.length;
  ta.focus();
  nUpdateContent(NS.selectedNoteId, ta.value);
  nHideSlash();
}

function nHideSlash() {
  const menu = document.getElementById('nSlashMenu');
  if (menu) menu.classList.add('hidden');
  NS._slashRange = null;
}

/* ── Copy content to clipboard ─────────────────────────────── */
function nCopyContent(id) {
  const n = ND.notes.find(x=>x.id===id);
  if(!n) return;
  const text = (n.title?'# '+n.title+'\n\n':'')+(n.content||'');
  navigator.clipboard.writeText(text).then(()=>{
    if(typeof toast==='function') toast('Contenu copié dans le presse-papier','fa-copy');
  }).catch(()=>{
    // Fallback
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    if(typeof toast==='function') toast('Contenu copié','fa-copy');
  });
}

    <div class="meta">${cat?'<span style="color:'+cat.color+'">'+escH(cat.name)+'</span> · ':''}Créée ${new Date(n.createdAt).toLocaleDateString('fr-FR')} · Modifiée ${new Date(n.updatedAt).toLocaleDateString('fr-FR')} · ${n.wordCount||0} mots</div>
    ${tags.length?'<div class="tags">'+tags.map(t=>'<span class="tag" style="border-left:3px solid '+t.color+'">'+escH(t.name)+'</span>').join('')+'</div>':''}

    <div>${mdRender(n.content||'')}</div>
    <script>window.onload=function(){window.print();}<\/script></body></html>`);
  w.document.close();
}
function nToggleTag(id, tagId) {
  const n = ND.notes.find(x=>x.id===id);
  if(!n) return;
  if(!n.tagIds) n.tagIds=[];
  const idx = n.tagIds.indexOf(tagId);
  if(idx===-1) n.tagIds.push(tagId); else n.tagIds.splice(idx,1);
  n.updatedAt = Date.now();
  svNotesData();
}
function nSetColor(id, color) {
  const n = ND.notes.find(x=>x.id===id);
  if(n){ n.color=color; n.updatedAt=Date.now(); svNotesData(); }
}

function nAddTag() {
  const name = (document.getElementById('newTagName')||{}).value||'';

  if(!name.trim()) return;
  const id = 'nt'+Date.now();
  ND.tags.push({id, name:name.trim(), color});
  svNotesData();
  if(typeof toast==='function') toast('Tag ajouté','fa-check');
  openTagM();
  rNotes();
}

function nDeleteTag(id) {
  ND.tags = ND.tags.filter(t=>t.id!==id);
  ND.notes.forEach(n=>{ if(n.tagIds) n.tagIds=n.tagIds.filter(t=>t!==id); });
  svNotesData();
  if(typeof toast==='function') toast('Tag supprimé','fa-check');
  openTagM();
  rNotes();
}
