/* ── Unarchive Note ────────────────────────────────────────── */
function nUnarchive(id) {
  const n = ND.notes.find(x=>x.id===id);
  if(n){ n.isArchived=false; n.updatedAt=Date.now(); svNotesData(); if(typeof toast==='function') toast('Note désarchivée','fa-box-open'); }
}

/* ── Export Note as Markdown ───────────────────────────────── */
function nExportNote(id) {
  const n = ND.notes.find(x=>x.id===id);
  if(!n) return;
  const blob = new Blob(['# '+n.title+'\n\n'+(n.content||'')], {type:'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (n.title||'note').replace(/[^a-zA-Z0-9àâéèêëïîôùûüç\-]/g,'_')+'.md';
  a.click();
  URL.revokeObjectURL(a.href);
  if(typeof toast==='function') toast('Note exportée','fa-download');
}

/* ── Duplicate Note ────────────────────────────────────────── */
function nDuplicateNote(id) {
  const n = ND.notes.find(x=>x.id===id);
  if(!n) return;
  const dup = Object.assign({}, n, {
    id: 'n'+Date.now(),
    title: (n.title||'')+' (copie)',
    tagIds: (n.tagIds||[]).slice(),
    isPinned: false,
    createdAt: Date.now(),
    updatedAt: Date.now()
  });
  ND.notes.unshift(dup);
  svNotesData();
  if(typeof toast==='function') toast('Note dupliquée','fa-copy');
  rNotes();
}

  var sendDisabled=!totalRecipients&&!send._testMode?'disabled':'';

  var sigText=window.MK_SIGNATURE?'Signature Gmail':'Pas de signature';

  /* Build full modal HTML */

  h+='<div class="flex items-center justify-between mb-5"><h2 class="font-disp font-bold text-lg">'+(isExisting?'Envoyer : '+escHtml(send.item.name||send.item.subject):'\U0001f4e7 Rédiger & Envoyer')+'</h2><span class="bdg '+sigBadge+' text-[.6rem]"><i class="fa-solid fa-'+sigIcon+' mr-1"></i>'+sigText+'</span></div>';

  if(!isExisting){
    h+='<div class="mb-4"><label class="text-xs text-mut block mb-1.5">Objet</label><input type="text" id="mkeSubject" class="fi" placeholder="Objet de l\'email" value="'+escHtml(send.item.subject)+'" oninput="window._mkCampSend.item.subject=this.value"></div>';

    h+='<div class="text-[.6rem] text-mut mb-1.5">Variables : <code class="bg-sAlt px-1 rounded">{{prenom}}</code> <code class="bg-sAlt px-1 rounded">{{nom}}</code> <code class="bg-sAlt px-1 rounded">{{name}}</code> <code class="bg-sAlt px-1 rounded">{{entreprise}}</code> <code class="bg-sAlt px-1 rounded">{{poste}}</code></div>';
    h+='<div class="mb-3"><div class="text-[.6rem] text-mut mb-1.5"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>Template</div><div class="flex flex-wrap gap-1.5">'+tplButtons+'</div></div>';
    h+='<div id="mkeQuill"></div></div>';
  }

  h+='<div class="mb-4">';
  h+='<div class="flex items-center justify-between mb-2"><label class="text-xs font-semibold text-mut"><i class="fa-solid fa-users mr-1"></i>Destinataires <span class="text-ok font-bold ml-1">'+totalRecipients+'</span></label>';
  h+='<div class="flex gap-2"><button onclick="mkSaveCurrentSelectionAsGroup()" class="text-[.6rem] text-acc hover:underline bp" '+(selTags.length?'':'style="opacity:.4;pointer-events:none"')+'><i class="fa-solid fa-bookmark mr-0.5"></i>Sauver en groupe</button></div></div>';

/* --- Tag toggle --- */
window.mkToggleCampTag=function(tag){
  if(!window._mkCampSend._selTags)window._mkCampSend._selTags=[];
  var arr=window._mkCampSend._selTags;
  var idx=arr.indexOf(tag);if(idx>=0)arr.splice(idx,1);else arr.push(tag);
  mkCampaignComposeModal();
};
window.mkSelectAllTags=function(){window._mkCampSend._selTags=mkGetAllTags();mkCampaignComposeModal();};

/* --- Manual email --- */
window.mkAddManualEmail=function(){
  var inp=document.getElementById('mkeManualEmail');
  if(!inp)return;
  var email=inp.value.trim();
  if(!email||email.indexOf('@')===-1){toast('Email invalide','err');return;}
  if(!window._mkCampSend._manualEmails)window._mkCampSend._manualEmails=[];
  if(window._mkCampSend._manualEmails.indexOf(email)!==-1){toast('Email déjà ajouté','info');return;}
  window._mkCampSend._manualEmails.push(email);
  inp.value='';
  mkCampaignComposeModal();
};
window.mkRemoveManualEmail=function(idx){if(window._mkCampSend._manualEmails){window._mkCampSend._manualEmails.splice(idx,1);mkCampaignComposeModal();}};
window.mkSaveCurrentSelectionAsGroup=function(){
  var sel=window._mkCampSend._selTags||[];
  if(!sel.length){toast('Sélectionne au moins un tag','err');return;}
  var name=prompt('Nom du groupe :',sel.slice(0,3).join(', ')+(sel.length>3?' +'+(sel.length-3):''));
  if(!name)return;
  mkSaveGroup(name,sel);
  mkCampaignComposeModal();
};

/* --- Save draft --- */
window.mkSaveDraftFromCompose=function(){
  var send=window._mkCampSend;
  var subject=send.item.subject||document.getElementById('mkeSubject')?.value||'';
  var body=mkGetQuillHTML();
  if(!subject&&!body){toast('Renseigne au moins un objet ou un corps','err');return;}
  MK.emails.push({name:'[Brouillon] '+subject,subject:subject,body:body,status:'draft',createdAt:new Date().toISOString()});
  svMk();clsM();toast('Brouillon sauvegardé','ok');rMarketing();
};

/* --- Enhanced Gmail Send --- */
window.mkExecuteEnhancedSend=async function(){
  var send=window._mkCampSend;
  if(!send)return;
  if(!gcalHasValidToken()){toast('Connecte ton compte Google d\'abord','err');return;}
  var selTags=send._selTags||[];
  var contacts=mkContactsByTag(selTags).filter(function(c){return c.email});
  var manualEmails=send._manualEmails||[];
  var manualContacts=manualEmails.map(function(e){return{id:'manual',email:e,firstName:'',lastName:'',company:'',title:'',_fkey:'manual',_folder:'Manual'};});
  var allContacts=contacts.concat(manualContacts);
  if(!allContacts.length&&!send._testMode){toast('Aucun contact avec email','err');return;}
  var subject=send.item.subject||document.getElementById('mkeSubject')?.value||'';
  var bodyTemplate=mkGetQuillHTML();
  var signature=window.MK_SIGNATURE||'';
  var recipients=[];
  if(send._testMode){
    try{var prof=await gcalGetProfile();recipients=[{email:prof.emailAddress||prof.email||'',firstName:'Moi',lastName:''}];}catch(e){toast('Impossible de récupérer ton email','err');return;}
  }else{recipients=allContacts;}
  if(!send._testMode&&!subject){toast('Ajoute un objet','err');return;}
  if(!send._testMode&&!bodyTemplate){toast('Écris un message','err');return;}
  toast('Envoi en cours...','info');
  var sent=0;var errors=0;
  var encodedSubject=typeof gmailEncodeSubject==='function'?gmailEncodeSubject(subject):'=?UTF-8?B?'+btoa(unescape(encodeURIComponent(subject)))+'?=';
  if(send._bccMode&&!send._testMode){
    try{
      var bccList=recipients.map(function(r){return r.email}).join(', ');
      var mimeLines=['To: undisclosed-recipients:;','Bcc: '+bccList,'Subject: '+encodedSubject,'Content-Type: text/html; charset=UTF-8','MIME-Version: 1.0','',''];
      var rawBody=mimeLines.join('\r\n')+bodyTemplate.replace(/\{\{signature\}\}/g,signature);
      var encoded=btoa(unescape(encodeURIComponent(rawBody))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      var r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',headers:{Authorization:'Bearer '+GCAL.token,'Content-Type':'application/json'},body:JSON.stringify({raw:encoded})});
      if(r.ok){sent=recipients.length;recipients.forEach(function(rcpt,i){window.MK_ELOG.push({id:Date.now()+i,to:rcpt.email,subject:subject,status:'sent',date:new Date().toISOString(),contactName:contactDisplayName(rcpt)});});}else errors=recipients.length;
    }catch(e){errors=recipients.length;console.error(e);}
  }else{
    for(var i=0;i<recipients.length;i++){
      try{
        var rcpt=recipients[i];
        var personalized=mkPersonalizeBody(bodyTemplate.replace(/\{\{signature\}\}/g,signature),rcpt);
        var mimeLines2=['To: '+rcpt.email,'Subject: '+encodedSubject,'Content-Type: text/html; charset=UTF-8','MIME-Version: 1.0','',''];
        var rawBody2=mimeLines2.join('\r\n')+personalized;
        var encoded2=btoa(unescape(encodeURIComponent(rawBody2))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
        var r2=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',headers:{Authorization:'Bearer '+GCAL.token,'Content-Type':'application/json'},body:JSON.stringify({raw:encoded2})});
        if(r2.ok){
          sent++;
          window.MK_ELOG.push({id:Date.now()+i,to:rcpt.email,subject:subject,status:'sent',date:new Date().toISOString(),contactName:contactDisplayName(rcpt)});
        }else{errors++;}
      }catch(e){errors++;console.error(e);}
      if(i<recipients.length-1)await new Promise(function(r){setTimeout(r,200)});
    }
  }
  svElog();
  if(send._testMode){toast(sent?'Email de test envoyé !':'Échec de l\'envoi',sent?'ok':'err');}
  else{
    send.item.sentCount=(send.item.sentCount||0)+sent;
    send.item.status='sent';
    if(!send.item.name)send.item.name=subject;
    if(send.item.createdAt&&MK.emails){
      var idx2=MK.emails.findIndex(function(e){return e.createdAt===send.item.createdAt});
      if(idx2>=0)MK.emails[idx2]=send.item;
    }
    svMk();clsM();rMarketing();
    toast(sent+' email'+(sent>1?'s':'')+' envoyé'+(sent>1?'s':'')+(errors?' ('+errors+' échec'+(errors>1?'s':'')+')':''),'ok');
  }
};

/* --- Check email replies --- */
window.checkEmailReplies=async function(){
  if(!gcalHasValidToken()||!window.MK_ELOG||!window.MK_ELOG.length)return;
  try{
    var profile=await gcalGetProfile();
    var since=window.MK_ELOG.reduce(function(min,e){return Math.min(min,new Date(e.date).getTime())},Date.now()-7*86400000);
    var sinceStr=new Date(since).toISOString();
    var r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages?q=after:'+sinceStr.split('T')[0]+'&maxResults=50',{headers:{Authorization:'Bearer '+GCAL.token}});
    if(!r.ok)return;
    var data=await r.json();
    if(!data.messages)return;
    var updated=false;
    for(var i=0;i<data.messages.length&&i<10;i++){
      var msgId=data.messages[i].id;
      var mr=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/'+msgId+'?format=metadata&metadataHeaders=From&metadataHeaders=References',{headers:{Authorization:'Bearer '+GCAL.token}});
      if(!mr.ok)continue;
      var msg=await mr.json();
      var headers=(msg.payload&&msg.payload.headers)||[];
      var from=headers.find(function(h){return h.name==='From'})||{};
      var fromEmail=(from.value||'').replace(/.*<(.+?)>.*/,function(m,e){return e});
      var replyTo=window.MK_ELOG.find(function(e){return fromEmail===e.to&&!e.replyDate});
      if(replyTo){replyTo.replyDate=new Date().toISOString();replyTo.replied=true;updated=true;}
    }
    if(updated){svElog();if(S.page==='marketing'&&S.mkv==='emails')rMarketing();}
  }catch(e){console.error('checkEmailReplies:',e);}
};

/* Auto-check replies every 5 min */
setInterval(function(){if(gcalHasValidToken()&&window.MK_ELOG&&window.MK_ELOG.length)checkEmailReplies();},300000);

        h+='<div class="flex-1 min-w-0"><div class="text-sm font-medium">'+escHtml(c.name||c.subject||'Sans titre')+'</div>';
        h+='<div class="text-xs text-mut mt-1">'+escHtml(c.subject||'')+'</div>';
        if(isSent)h+='<div class="text-[.6rem] text-mut mt-1"><i class="fa-solid fa-check text-ok mr-1"></i>Envoyé</div>';

        if(isDraft)h+='<button onclick="window._mkCampSend=null;mkCampaignComposeModal(MK.emails['+i+'],'+i+')" class="h-8 px-3 rounded-lg bg-sAlt border border-bdr text-[.6rem] text-mut hover:text-txt bp"><i class="fa-solid fa-pen mr-1"></i>Modifier</button>';
        if(isSent&&c.subject)h+='<button onclick="window._mkCampSend=null;mkCampaignComposeModal(MK.emails['+i+'],'+i+')" class="h-8 px-3 rounded-lg bg-sAlt border border-bdr text-[.6rem] text-mut hover:text-txt bp"><i class="fa-solid fa-rotate-right mr-1"></i>Relancer</button>';
        h+='<button onclick="delMkItem(\'emails\','+i+');" class="w-7 h-7 rounded-lg hover:bg-accS text-mut hover:text-acc flex items-center justify-center shrink-0"><i class="fa-solid fa-trash text-[.6rem]"></i></button>';
        h+='</div>';
      });
      h+='</div>';
    }else{
      h+='<div class="text-mut text-sm text-center py-10">Aucun email. Cliquez sur "Rédiger un email" pour commencer.</div>';
